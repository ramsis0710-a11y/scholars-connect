<title>Scholars Connect - Juge Claude</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0e27; color: #fff; min-height: 100vh; padding: 20px; }
.container { max-width: 1400px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; flex-wrap: wrap; gap: 15px; border-bottom: 2px solid #667eea; }
.logo { font-size: 32px; font-weight: 700; background: linear-gradient(135deg, #667eea, #10b981, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo-sub { font-size: 14px; opacity: 0.6; display: block; font-weight: 400; }
.header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 13px; }
.btn-primary { background: #667eea; color: white; }
.btn-success { background: #22c55e; color: #0a0e27; }
.btn-danger { background: #ef4444; color: white; }
.btn-secondary { background: rgba(255,255,255,0.1); color: white; }
.btn-admin { background: #f59e0b; color: #0a0e27; }
.btn-arabic { background: #1a7a5a; color: white; }
.btn:hover { transform: scale(1.05); opacity: 0.9; }
.categories-nav { display: flex; gap: 10px; padding: 15px 0; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,0.05); overflow-x: auto; }
.cat-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: white; cursor: pointer; font-size: 13px; transition: 0.3s; white-space: nowrap; }
.cat-btn:hover { background: rgba(255,255,255,0.1); }
.cat-btn.active { background: #667eea; border-color: #667eea; }
.form-container { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; margin: 20px 0; display: none; border: 1px solid rgba(255,255,255,0.1); }
.form-container.active { display: block; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; opacity: 0.8; font-weight: 500; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; font-size: 14px; }
.form-group textarea { min-height: 100px; resize: vertical; }
.form-group select option { background: #1a1a2e; color: white; }
.keyboard-container { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; margin: 10px 0; display: none; border: 1px solid rgba(255,255,255,0.1); }
.keyboard-container.active { display: block; }
.keyboard-row { display: flex; gap: 4px; margin: 4px 0; justify-content: center; flex-wrap: wrap; }
.key-btn { min-width: 40px; padding: 8px 6px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: rgba(255,255,255,0.05); color: white; cursor: pointer; font-family: 'Traditional Arabic', 'Amiri', serif; font-size: 18px; transition: 0.2s; text-align: center; }
.key-btn:hover { background: rgba(16,185,129,0.3); transform: scale(1.05); }
.key-btn.space { min-width: 80px; }
.status-bar { display: flex; gap: 20px; padding: 15px 0; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,0.05); }
.status-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.user-avatar { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); font-weight: 700; margin-right: 10px; }
.user-info { display: flex; align-items: center; gap: 10px; }
.question-grid { display: grid; gap: 20px; margin: 20px 0; }
.question-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; }
.question-card:hover { transform: translateY(-2px); border-color: #667eea; }
.question-card.claude-card { border-color: #8b5cf6; box-shadow: 0 0 20px rgba(139,92,246,0.2); }
.question-title { font-size: 18px; font-weight: 600; color: #667eea; }
.question-meta { font-size: 13px; opacity: 0.6; margin: 5px 0; display: flex; gap: 15px; flex-wrap: wrap; }
.question-content { margin: 10px 0; }
.question-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.answers-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
.answer-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px; margin: 8px 0; border-left: 3px solid #667eea; }
.answer-item.claude-answer { border-left: 4px solid #8b5cf6; background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(236,72,153,0.05)); }
.answer-item.scholar-answer { border-left: 4px solid #10b981; }
.answer-meta { font-size: 12px; opacity: 0.6; display: flex; gap: 15px; flex-wrap: wrap; }
.claude-badge { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; }
.claude-status { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #f59e0b; color: #0a0e27; }
.timer-badge { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #3b82f6; color: white; }
.domain-tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-left: 5px; }
.domain-islam { background: #059669; color: white; }
.domain-medecine { background: #ef4444; color: white; }
.domain-pharmacie { background: #f472b6; color: white; }
.domain-chimie { background: #06b6d4; color: white; }
.domain-ia { background: #8b5cf6; color: white; }
.domain-iot { background: #14b8a6; color: white; }
.domain-gmao { background: #f59e0b; color: #0a0e27; }
.domain-meca { background: #78716c; color: white; }
.domain-general { background: #667eea; color: white; }
.notification { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 12px; z-index: 1000; display: none; animation: slideIn 0.3s; max-width: 90%; }
.notification.success { background: #22c55e; color: #0a0e27; display: block; }
.notification.error { background: #ef4444; color: white; display: block; }
.notification.info { background: #3b82f6; color: white; display: block; }
.notification.claude { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; display: block; }
@keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-pending { background: #eab308; color: #0a0e27; }
.badge-answered { background: #22c55e; color: #0a0e27; }
.badge-assigned { background: #8b5cf6; color: white; }
.badge-claude { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; }
.scholar-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
.scholar-card:hover { transform: translateY(-3px); border-color: #667eea; }
.claude-response { white-space: pre-wrap; line-height: 1.7; font-size: 14px; }
.claude-response strong { color: #8b5cf6; }
@media (max-width: 600px) {
.header { flex-direction: column; align-items: stretch; }
.header-actions { flex-wrap: wrap; }
.header-actions button { flex: 1; text-align: center; font-size: 11px; padding: 8px 12px; }
.key-btn { min-width: 32px; padding: 6px 4px; font-size: 14px; }
.cat-btn { font-size: 11px; padding: 6px 12px; }
}
</style>

    try { localStorage.setItem(key, JSON.stringify(data)); return true; }
    catch(e) { return false; }

    try { var data = localStorage.getItem(key); if (data) return JSON.parse(data); return defaultValue; }

function claudeSearchKnowledge(question) {
    var searchText = (question.title + ' ' + question.content).toLowerCase();
    for (var key in claudeKnowledgeBase) {
        if (searchText.indexOf(key) !== -1) {

    return null;
}

// JUGE CLAUDE - AJOUT DE RÉPONSE
// ============================================================
function addClaudeAnswer(questionId, content, reason) {
    for (var i = 0; i < questions.length; i++) {
        if (questions[i].id === questionId) {
            if (!questions[i].answers) questions[i].answers = [];
            questions[i].answers.push({
                username: 'Juge Claude',
                userId: 0,
                content: content,
                language: currentLanguage,
                date: new Date().toLocaleDateString(),
                timestamp: new Date().toISOString(),
                isClaude: true,
                claudeReason: reason
            });
            if (questions[i].status === 'pending' || questions[i].status === 'assigned') {
                questions[i].status = 'claude_answered';
            }
            saveQuestions();
            renderQuestions();
            break;
        }
    }
}

// ============================================================
// TRAITEMENT JUGE CLAUDE
// ============================================================
function triggerClaudeJudge(question) {
    if (!question.scholar) return;
    var scholar = question.scholar;
    
    if (!scholar.literature || scholar.literature.length === 0) {
        setTimeout(function() {
            var claudeAnswer = claudeGenerateAnswer(question, scholar, 'no_literature');
            addClaudeAnswer(question.id, claudeAnswer, 'no_literature');
            showNotification('🤖 Juge Claude a répondu avec une réponse complète', 'claude');
        }, 2000);
        return;
    }
    
    showNotification('⏱️ Juge Claude surveille (5 min max)...', 'info');
    var questionId = question.id;
    setTimeout(function() {
        var q = null;
        for (var i = 0; i < questions.length; i++) {
            if (questions[i].id === questionId) { q = questions[i]; break; }
        }
        if (!q) return;
        
        var scholarResponded = false;
        if (q.answers) {
            for (var j = 0; j < q.answers.length; j++) {
                if (q.answers[j].isScholarResponse) { scholarResponded = true; break; }
            }
        }
        
        if (!scholarResponded) {
            var claudeAnswer = claudeGenerateAnswer(q, q.scholar, 'timeout_5min');
            addClaudeAnswer(q.id, claudeAnswer, 'timeout_5min');
            showNotification('⏱️ Juge Claude a répondu avec une réponse complète', 'claude');
        }
    }, 30000);
}

function insertChar(char) {
    var activeElement = document.activeElement;
    if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
        var start = activeElement.selectionStart;
        var end = activeElement.selectionEnd;
        var value = activeElement.value;
        activeElement.value = value.substring(0, start) + char + value.substring(end);
        activeElement.selectionStart = activeElement.selectionEnd = start + char.length;
        activeElement.focus();
    } else {
        var cf = document.getElementById('qContent');
        if (cf) { cf.value += char; cf.focus(); }
    }
}

function clearText() {
    var activeElement = document.activeElement;
    if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
        activeElement.value = activeElement.value.substring(0, activeElement.value.length - 1);
        activeElement.focus();
    }
}

function hideForms() {
    var forms = document.querySelectorAll('.form-container');
    for (var i = 0; i < forms.length; i++) forms[i].classList.remove('active');
    var kb = document.getElementById('arabicKeyboard');
    if (kb) kb.classList.remove('active');
}
function goToAdmin() { window.location.href = '/admin'; }

function updateCategories() {
    var domain = document.getElementById('qDomain').value;
    var cats = categoriesByDomain[domain] || [];
    var select = document.getElementById('qCategory');
    select.innerHTML = '';
    for (var i = 0; i < cats.length; i++) {
        var opt = document.createElement('option');
        opt.value = cats[i];
        opt.textContent = cats[i];
        select.appendChild(opt);
    }
}

function login() {
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;
    var user = null;
    for (var i = 0; i < users.length; i++) {
        if (users[i].email === email && users[i].password === password) { user = users[i]; break; }
    }
    if (user) {
        currentUser = user;
        if (user.language) currentLanguage = user.language;
        saveSession();
        saveToStorage(STORAGE_KEYS.PREF_LANG, currentLanguage);
        updateUI();
        hideForms();
        showNotification('✅ Connecté ! Session sauvegardée', 'success');
        renderQuestions();
    } else {
        showNotification('❌ Identifiants incorrects', 'error');
    }
}

function register() {
    var username = document.getElementById('regUsername').value;
    var email = document.getElementById('regEmail').value;
    var password = document.getElementById('regPassword').value;
    var language = document.getElementById('regLanguage').value;
    var domain = document.getElementById('regDomain').value;
    if (!username || !email || !password) { showNotification('Veuillez remplir tous les champs', 'error'); return; }
    if (password.length < 6) { showNotification('Mot de passe : 6 caractères min', 'error'); return; }
    for (var i = 0; i < users.length; i++) {
        if (users[i].email === email) { showNotification('Email déjà utilisé', 'error'); return; }
    }
    var newUser = { id: users.length + 1, username: username, email: email, password: password, role: 'user', language: language, domain: domain };
    users.push(newUser);
    saveUsers();
    currentUser = newUser;
    currentLanguage = language;
    saveSession();
    saveToStorage(STORAGE_KEYS.PREF_LANG, currentLanguage);
    updateUI();
    hideForms();
    showNotification('✅ Inscription réussie !', 'success');
    renderQuestions();
}

function logout() {
    if (!confirm('Voulez-vous vraiment vous déconnecter ?')) return;
    currentUser = null;
    saveSession();
    updateUI();
    showNotification('🚪 Déconnecté', 'info');
}

function updateUI() {
    if (currentUser) {
        document.getElementById('authButtons').style.display = 'none';
        document.getElementById('userActions').style.display = 'flex';
        document.getElementById('userDisplay').innerHTML = '<span class="user-avatar">' + currentUser.username[0].toUpperCase() + '</span> <span>' + currentUser.username + '</span>';
        document.getElementById('newQuestionBtn').style.display = 'inline-block';
        document.getElementById('userRole').innerHTML = '👤 ' + currentUser.username;
        if (currentUser.role === 'admin') document.getElementById('adminBtn').style.display = 'inline-block';
    } else {
        document.getElementById('authButtons').style.display = 'flex';
        document.getElementById('userActions').style.display = 'none';
        document.getElementById('newQuestionBtn').style.display = 'none';
        document.getElementById('adminBtn').style.display = 'none';
        document.getElementById('userRole').innerHTML = '👤 Visiteur';
    }
    document.getElementById('langDisplay').innerHTML = '🌐 ' + getLangName(currentLanguage);
}

function addToHistory(action, data) {
    var entry = { id: myHistory.length + 1, userId: currentUser ? currentUser.id : null, username: currentUser ? currentUser.username : 'Anonyme', action: action, data: data, date: new Date().toLocaleString() };
    myHistory.unshift(entry);
    if (myHistory.length > 200) myHistory = myHistory.slice(0, 200);
    saveHistory();
}

function renderHistory() {
    var container = document.getElementById('historyList');
    var stats = document.getElementById('historyStats');
    var myQuestions = questions.filter(function(q) { return q.username === currentUser.username; });
    var myAnswers = 0;
    for (var i = 0; i < questions.length; i++) {
        if (questions[i].answers) {
            for (var j = 0; j < questions[i].answers.length; j++) {
                if (questions[i].answers[j].username === currentUser.username) myAnswers++;
            }
        }
    }
    stats.innerHTML = '<span style="background:rgba(255,255,255,0.1);padding:5px 12px;border-radius:12px;">📋 ' + myQuestions.length + ' questions</span><span style="background:rgba(255,255,255,0.1);padding:5px 12px;border-radius:12px;">💬 ' + myAnswers + ' réponses</span><span style="background:rgba(255,255,255,0.1);padding:5px 12px;border-radius:12px;">📊 ' + myHistory.length + ' actions</span>';
    if (myQuestions.length === 0) { container.innerHTML = '<p style="text-align:center;opacity:0.5;padding:30px;">Aucune question.</p>'; return; }
    var html = '';
    for (var k = 0; k < myQuestions.length; k++) {
        var q = myQuestions[k];
        var dClass = getDomainClass(q.domain);
        html += '<div class="question-card" style="margin:10px 0;"><div class="question-title">' + getDomainIcon(q.domain) + ' ' + q.title + '</div><div class="question-meta"><span class="domain-tag ' + dClass + '">' + q.domain + '</span> | 📂 ' + q.category + ' | 📅 ' + q.date + '</div><div class="question-content">' + q.content + '</div>';
        if (q.answers && q.answers.length > 0) {
            html += '<div class="answers-section"><strong>💬 ' + q.answers.length + ' réponses</strong>';
            for (var m = 0; m < q.answers.length; m++) {
                var a = q.answers[m];
                var aClass = a.isClaude ? 'claude-answer' : (a.isScholarResponse ? 'scholar-answer' : '');
                html += '<div class="answer-item ' + aClass + '"><div class="claude-response">' + a.content + '</div><div class="answer-meta">👤 ' + a.username + ' | 📅 ' + a.date + '</div></div>';
            }
            html += '</div>';
        }
        html += '</div>';
    }
    container.innerHTML = html;
}

function askQuestion() {
    if (!currentUser) { showNotification('Veuillez vous connecter', 'error'); return; }
    var domain = document.getElementById('qDomain').value;
    var category = document.getElementById('qCategory').value;
    var title = document.getElementById('qTitle').value;
    var content = document.getElementById('qContent').value;
    var language = document.getElementById('qLanguage').value;
    if (!title || !content) { showNotification('Titre et contenu obligatoires', 'error'); return; }
    var scholar = assignScholar(domain, category);
    var question = { id: questions.length + 1, domain: domain, title: title, category: category, content: content, username: currentUser.username, userId: currentUser.id, language: language, date: new Date().toLocaleDateString(), timestamp: new Date().toISOString(), status: scholar ? 'assigned' : 'pending', scholar: scholar, answers: [] };
    questions.unshift(question);
    saveQuestions();
    addToHistory('question', { title: title, domain: domain });
    var message = '✅ Question publiée !';
    if (scholar) message += ' Scholar : ' + scholar.name;
    showNotification(message, 'success');
    hideForms();
    renderQuestions();
    triggerClaudeJudge(question);
    document.getElementById('qTitle').value = '';
    document.getElementById('qContent').value = '';
}

function renderQuestions() {
    var container = document.getElementById('questionsContainer');
    var filtered = currentFilter === 'all' ? questions : questions.filter(function(q) { return q.domain === currentFilter; });
    document.getElementById('questionCount').textContent = '📋 ' + questions.length + ' questions';
    document.getElementById('scholarCount').textContent = '🎓 ' + scholarsData.length + ' Scholars';
    if (filtered.length === 0) { container.innerHTML = '<p style="text-align:center;opacity:0.5;padding:40px;">Aucune question dans ce domaine.</p>'; return; }
    var html = '';
    for (var i = 0; i < filtered.length; i++) {
        var q = filtered[i];
        var hasClaudeAnswer = false;
        if (q.answers) { for (var c = 0; c < q.answers.length; c++) { if (q.answers[c].isClaude) { hasClaudeAnswer = true; break; } } }
        var cardClass = hasClaudeAnswer ? 'claude-card' : '';
        var statusClass = q.status === 'claude_answered' ? 'badge-claude' : (q.status === 'assigned' ? 'badge-assigned' : q.status === 'answered' ? 'badge-answered' : 'badge-pending');
        var statusLabel = q.status === 'claude_answered' ? '🤖 Juge Claude' : (q.status === 'assigned' ? 'Assigné' : q.status === 'answered' ? 'Répondu' : 'En attente');
        var dClass = getDomainClass(q.domain);
        var icon = getDomainIcon(q.domain);
        var scholarInfo = '';
        if (q.scholar) { var litCount = q.scholar.literature ? q.scholar.literature.length : 0; scholarInfo = '<span class="domain-tag ' + dClass + '">🎓 ' + q.scholar.name + ' (' + litCount + ' ouvrages)</span>'; }
        var answersHtml = '';
        if (q.answers && q.answers.length > 0) {
            answersHtml = '<div class="answers-section"><strong>💬 ' + q.answers.length + ' réponses</strong>';
            for (var j = 0; j < q.answers.length; j++) {
                var a = q.answers[j];
                var aClass = a.isClaude ? 'claude-answer' : (a.isScholarResponse ? 'scholar-answer' : '');
                var badge = '';
                if (a.isClaude) { badge = '<span class="claude-badge">🤖 Juge Claude</span> '; if (a.claudeReason === 'no_literature') badge += '<span class="claude-status">Sans littérature</span>'; if (a.claudeReason === 'timeout_5min') badge += '<span class="timer-badge">⏱️ 5 min</span>'; }
                answersHtml += '<div class="answer-item ' + aClass + '"><div style="margin-bottom:5px;">' + badge + '</div><div class="claude-response">' + a.content + '</div><div class="answer-meta">👤 ' + a.username + ' | 📅 ' + a.date + '</div></div>';
            }
            answersHtml += '</div>';
        } else { answersHtml = '<div style="margin-top:10px;opacity:0.5;font-size:13px;">💬 En attente (Juge Claude surveille)...</div>'; }
        var answerBtn = currentUser ? '<button class="btn btn-secondary" onclick="showAnswerForm(' + q.id + ')">💬 Répondre</button>' : '';
        html += '<div class="question-card ' + cardClass + '"><div class="question-title">' + icon + ' ' + q.title + '</div><div class="question-meta"><span class="domain-tag ' + dClass + '">' + q.domain + '</span> 👤 ' + q.username + ' | 📂 ' + q.category + ' | 🌐 ' + getLangName(q.language) + ' | 📅 ' + q.date + ' | <span class="badge ' + statusClass + '">' + statusLabel + '</span> ' + scholarInfo + '</div><div class="question-content">' + q.content + '</div><div class="question-actions">' + answerBtn + '</div>' + answersHtml + '</div>';
    }
    container.innerHTML = html;
}

function showAnswerForm(questionId) {
    if (!currentUser) { showNotification('Veuillez vous connecter', 'error'); return; }
    var content = prompt('Votre réponse :');
    if (!content) return;
    var lang = prompt('Langue (fr/ar/en/es/de/it/pt) :', currentLanguage) || currentLanguage;
    for (var i = 0; i < questions.length; i++) {
        if (questions[i].id === questionId) {
            if (!questions[i].answers) questions[i].answers = [];
            var isScholar = scholarsData.some(function(s) { return s.name === currentUser.username; });
            questions[i].answers.push({ username: currentUser.username, userId: currentUser.id, content: content, language: lang, date: new Date().toLocaleDateString(), timestamp: new Date().toISOString(), aiVerified: isScholar, isScholarResponse: isScholar });
            if (isScholar) questions[i].status = 'answered';
            saveQuestions();
            addToHistory('answer', { questionTitle: questions[i].title });
            if (isScholar) {
                var hasClaudeAns = false;
                for (var c = 0; c < questions[i].answers.length; c++) { if (questions[i].answers[c].isClaude) { hasClaudeAns = true; break; } }
                if (hasClaudeAns) { showNotification('📢 Réponse du Scholar diffusée (arrivée en retard)', 'claude'); } else { showNotification('✅ Réponse du Scholar publiée !', 'success'); }
            } else { showNotification('✅ Réponse publiée !', 'success'); }
            renderQuestions();
            break;
        }
    }
}

function loadData() { renderQuestions(); showNotification('✅ Données actualisées', 'info'); }

// INIT
initializeApp();
</script>
