* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0e27; color: #fff; min-height: 100vh; padding: 20px; }
.container { max-width: 1400px; margin: 0 auto; }

.logo-sub { font-size: 14px; opacity: 0.6; display: block; font-weight: 400; }
.header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 13px; }
.btn-primary { background: #667eea; color: white; }
.btn-success { background: #22c55e; color: #0a0e27; }
.btn-danger { background: #ef4444; color: white; }
.btn-secondary { background: rgba(255,255,255,0.1); color: white; }
.btn-admin { background: #f59e0b; color: #0a0e27; }

.categories-nav { display: flex; gap: 8px; padding: 15px 0; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,0.05); overflow-x: auto; }
.cat-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: white; cursor: pointer; font-size: 11px; transition: 0.3s; white-space: nowrap; }
.cat-btn.active { background: #667eea; border-color: #667eea; }
.cat-btn:hover { background: rgba(255,255,255,0.1); }
.form-container { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; margin: 20px 0; display: none; border: 1px solid rgba(255,255,255,0.1); }
.form-container.active { display: block; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; opacity: 0.8; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; font-size: 14px; }
.form-group textarea { min-height: 100px; }
.form-group select option { background: #1a1a2e; color: white; }
.status-bar { display: flex; gap: 20px; padding: 15px 0; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,0.05); }
.status-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.mongo-badge { background: #22c55e; color: white; padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.user-avatar { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #22c55e, #10b981); font-weight: 700; margin-right: 10px; }
.user-info { display: flex; align-items: center; gap: 10px; }
.question-grid { display: grid; gap: 20px; margin: 20px 0; }
.question-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.08); }
.question-card.claude-card { border-color: #8b5cf6; box-shadow: 0 0 20px rgba(139,92,246,0.2); }
.question-title { font-size: 18px; font-weight: 600; color: #667eea; }
.question-meta { font-size: 13px; opacity: 0.6; margin: 5px 0; display: flex; gap: 15px; flex-wrap: wrap; }
.question-content { margin: 10px 0; }
.question-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.answers-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
.answer-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px; margin: 8px 0; border-left: 3px solid #667eea; }
.answer-item.claude-answer { border-left: 4px solid #8b5cf6; background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(236,72,153,0.05)); }
.answer-item.scholar-answer { border-left: 4px solid #10b981; }
.answer-meta { font-size: 12px; opacity: 0.6; display: flex; gap: 15px; flex-wrap: wrap; }
.claude-badge { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; }
.claude-status { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #f59e0b; color: #0a0e27; }
.timer-badge { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #3b82f6; color: white; }
.domain-tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-left: 5px; background: #667eea; color: white; }
.notification { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 12px; z-index: 1000; display: none; }
.notification.success { background: #22c55e; color: #0a0e27; display: block; }
.notification.error { background: #ef4444; color: white; display: block; }
.notification.info { background: #3b82f6; color: white; display: block; }
.notification.claude { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; display: block; }
.notification.mongo { background: #22c55e; color: white; display: block; }
.badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-pending { background: #eab308; color: #0a0e27; }
.badge-answered { background: #22c55e; color: #0a0e27; }
.badge-assigned { background: #8b5cf6; color: white; }
.badge-claude { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; }

.claude-response { white-space: pre-wrap; line-height: 1.7; font-size: 14px; }
@media (max-width: 600px) {
.header { flex-direction: column; align-items: stretch; }
.header-actions button { flex: 1; font-size: 11px; padding: 8px 12px; }

</style>

    'Architecture': ['Architecture moderne', 'Urbanisme', 'Patrimoine'],
    'Restauration': ['Gastronomie', 'Pâtisserie', 'Gestion'],
    'Général': ['Mathématiques', 'Physique', 'Informatique', 'Histoire']
};

var claudeKnowledgeBase = {
    'filetage': { 'definition': 'Filetage de haute précision pour l\'industrie pétrolière.', 'exigences': ['Tolérances (±0.05mm)', 'Pas de filetage précis', 'Angle 60° ou 75°', 'Contrôle API', 'Étanchéité gaz/liquides', 'Résistance 15 000 PSI'], 'normes': ['API 5B', 'API 5CT', 'TSH 511'], 'details': 'TSH 511 spécifie dimensions, tolérances, matériaux, traitements.' },
    'cnc': { 'definition': 'Commande numérique par ordinateur.', 'exigences': ['Précision ±0.01mm', 'G-code', 'Contrôle thermique'], 'details': 'Usinage haute précision.' },
    'vanne': { 'definition': 'Dispositif de contrôle des fluides.', 'exigences': ['Étanchéité', 'API 6D', 'Résistance 15 000 PSI'], 'details': 'Vannes pétrolières haute pression.' },
    'cardiologie': { 'definition': 'Branche médicale du cœur.', 'exigences': ['Diagnostic', 'Traitement', 'Suivi', 'Prévention'], 'details': 'Maladies cardiovasculaires.' },
    'fiqh': { 'definition': 'Jurisprudence islamique.', 'exigences': ['Coran', 'Sunna', 'Ijma', 'Qiyas'], 'details': 'Règles pratiques islamiques.' }
};

async function apiGet(endpoint) {
    try { var r = await fetch(API_URL + endpoint); return await r.json(); }
    catch(e) { console.error(e); return null; }
}
async function apiPost(endpoint, data) {
    try {
        var r = await fetch(API_URL + endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return await r.json();
    } catch(e) { console.error(e); return null; }
}

function claudeSearchKnowledge(question) {
    var t = (question.title + ' ' + question.content).toLowerCase();
    for (var k in claudeKnowledgeBase) if (t.indexOf(k) !== -1) return claudeKnowledgeBase[k];
    return null;
}

function claudeGenerateAnswer(question, scholar, reason) {
    var litRef = scholar.literature && scholar.literature.length > 0 ? scholar.literature.join(', ') : '';
    var kb = claudeSearchKnowledge(question);
    var a = '';
    
    if (reason === 'no_literature') {
        a = '🤖 RÉPONSE COMPLÈTE DU JUGE CLAUDE\n\n';
        a += '📋 Question : "' + question.title + '"\n\n';
        a += 'Le scholar ' + scholar.name + ' n\'a pas de littérature spécifique.\n\n━━━━━━━━━━━━━━━━━━━━\n\n🎯 RÉPONSE :\n\n';
        if (kb) {
            a += '📖 DÉFINITION :\n' + kb.definition + '\n\n';
            if (kb.exigences) { a += '✅ EXIGENCES :\n'; kb.exigences.forEach(function(e) { a += '   • ' + e + '\n'; }); a += '\n'; }
            if (kb.normes) { a += '📋 NORMES :\n'; kb.normes.forEach(function(n) { a += '   • ' + n + '\n'; }); a += '\n'; }
            if (kb.details) a += '📚 DÉTAILS :\n' + kb.details + '\n\n';
        } else {
            a += 'Cette question relève du domaine ' + question.domain + ' (' + question.category + ').\n\nConsultez la littérature spécialisée et les normes applicables.\n';
        }
        a += '━━━━━━━━━━━━━━━━━━━━\n💡 Le scholar pourra compléter.';
    } else if (reason === 'timeout_5min') {
        a = '⏱️ RÉPONSE COMPLÈTE DU JUGE CLAUDE (5 min)\n\n';
        a += '👨‍🎓 ' + scholar.name + ' · 📖 ' + litRef + '\n\n━━━━━━━━━━━━━━━━━━━━\n\n🎯 RÉPONSE :\n\n';
        if (kb) {
            a += '📖 DÉFINITION :\n' + kb.definition + '\n\n';
            if (kb.exigences) { a += '✅ EXIGENCES :\n'; kb.exigences.forEach(function(e) { a += '   • ' + e + '\n'; }); a += '\n'; }
            if (kb.normes) { a += '📋 NORMES :\n'; kb.normes.forEach(function(n) { a += '   • ' + n + '\n'; }); a += '\n'; }
            if (kb.details) a += '📚 DÉTAILS :\n' + kb.details + '\n\n';
        } else {
            a += 'Références : ' + litRef + '\nConsultez les ouvrages cités.\n';
        }
        a += '━━━━━━━━━━━━━━━━━━━━\n💡 Le scholar pourra compléter.';
    }
    return a;
}

async function addClaudeAnswer(questionId, content, reason) {
    await apiPost('/questions/' + questionId + '/answers', {
        username: 'Juge Claude', userId: 0, content: content,
        language: 'fr', isClaude: true, claudeReason: reason
    });
    await loadQuestions();
}

async function triggerClaudeJudge(question) {
    if (!question.scholar) return;
    var scholar = question.scholar;
    if (!scholar.literature || scholar.literature.length === 0) {
        setTimeout(async function() {
            await addClaudeAnswer(question._id, claudeGenerateAnswer(question, scholar, 'no_literature'), 'no_literature');
            showNotification('🤖 Juge Claude a répondu', 'claude');
        }, 3000);
        return;
    }
    showNotification('⏱️ Juge Claude surveille (30s)...', 'info');
    setTimeout(async function() {
        var q = questions.find(function(x) { return x._id === question._id; });
        if (!q) return;
        var responded = q.answers && q.answers.some(function(a) { return a.isScholarResponse; });
        if (!responded) {
            await addClaudeAnswer(q._id, claudeGenerateAnswer(q, q.scholar, 'timeout_5min'), 'timeout_5min');
            showNotification('⏱️ Juge Claude a répondu', 'claude');
        }
    }, 30000);
}

async function initializeApp() {
    currentUser = loadSession();
    buildCategoriesNav();
    buildDomainSelects();
    updateUI();
    await loadQuestions();
    if (currentUser) showNotification('🍃 Session restaurée depuis MongoDB : ' + currentUser.username, 'mongo');
}

function buildCategoriesNav() {
    var nav = document.getElementById('categoriesNav');
    var html = '<button class="cat-btn active" onclick="filterByDomain(\'all\', this)">🌍 Tous</button>';
    var icons = { 'Islam': '🕌', 'Médecine': '🏥', 'Pharmacie': '💊', 'Chimie': '⚗️', 'IA': '🤖', 'IoT': '🌐', 'GMAO': '🏭', 'Mécanique Pétrole': '⚙️', 'Gestion': '📊', 'Expertise Comptable': '💰', 'Droit': '⚖️', 'Économie': '📈', 'Culture Générale': '🌍', 'Art': '🎨', 'Architecture': '🏛️', 'Restauration': '🍽️', 'Général': '📚' };
    for (var d in categoriesByDomain) html += '<button class="cat-btn" onclick="filterByDomain(\'' + d + '\', this)">' + (icons[d] || '📖') + ' ' + d + '</button>';
    nav.innerHTML = html;
}

function buildDomainSelects() {
    var domains = Object.keys(categoriesByDomain);
    var icons = { 'Islam': '🕌', 'Médecine': '🏥', 'Pharmacie': '💊', 'Chimie': '⚗️', 'IA': '🤖', 'IoT': '🌐', 'GMAO': '🏭', 'Mécanique Pétrole': '⚙️', 'Gestion': '📊', 'Expertise Comptable': '💰', 'Droit': '⚖️', 'Économie': '📈', 'Culture Générale': '🌍', 'Art': '🎨', 'Architecture': '🏛️', 'Restauration': '🍽️', 'Général': '📚' };
    var qSel = document.getElementById('qDomain');
    qSel.innerHTML = '';
    domains.forEach(function(d) {
        var opt = document.createElement('option');
        opt.value = d;
        opt.textContent = (icons[d] || '📖') + ' ' + d;
        qSel.appendChild(opt);
    });
    updateCategories();
}

function filterByDomain(domain, btn) {
    currentFilter = domain;
    document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    renderQuestions();
}

function getDomainIcon(domain) {
    var icons = { 'Islam': '🕌', 'Médecine': '🏥', 'Pharmacie': '💊', 'Chimie': '⚗️', 'IA': '🤖', 'IoT': '🌐', 'GMAO': '🏭', 'Mécanique Pétrole': '⚙️', 'Gestion': '📊', 'Expertise Comptable': '💰', 'Droit': '⚖️', 'Économie': '📈', 'Culture Générale': '🌍', 'Art': '🎨', 'Architecture': '🏛️', 'Restauration': '🍽️', 'Général': '📚' };
    return icons[domain] || '📖';
}

function assignScholar(domain, category) {
    var a = scholarsData.filter(function(s) { return s.domain === domain && s.expertise === category; });
    if (a.length > 0) return a[Math.floor(Math.random() * a.length)];
    var f = scholarsData.filter(function(s) { return s.expertise === category; });
    return f.length > 0 ? f[0] : null;
}

function showScholars() {
    var container = document.getElementById('scholarsList');
    var filtered = currentFilter === 'all' ? scholarsData : scholarsData.filter(function(s) { return s.domain === currentFilter; });
    var html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;">';
    filtered.forEach(function(s) {
        var lit = s.literature ? s.literature.length : 0;
        var litBadge = lit > 0 ? '<span style="background:#22c55e;padding:2px 8px;border-radius:10px;font-size:10px;">📚 ' + lit + '</span>' : '<span style="background:#ef4444;padding:2px 8px;border-radius:10px;font-size:10px;">📚 Aucune</span>';
        html += '<div class="scholar-card"><strong>' + getDomainIcon(s.domain) + ' ' + s.name + '</strong> <span class="domain-tag">' + s.domain + '</span> ' + litBadge + '<div style="opacity:0.7;font-size:14px;margin-top:5px;">📂 ' + s.expertise + '</div><div style="color:#f59e0b;">⭐ ' + s.rating + '/5</div></div>';
    });
    container.innerHTML = html + '</div>';
    hideForms();
    document.getElementById('scholarsPopup').classList.add('active');
}

function showNotification(msg, type) {
    var el = document.getElementById('notification');
    el.textContent = msg;
    el.className = 'notification ' + (type || 'info');
    setTimeout(function() { el.className = 'notification'; }, 5000);
}

function showLogin() { hideForms(); document.getElementById('loginForm').classList.add('active'); }
function showRegister() { hideForms(); document.getElementById('registerForm').classList.add('active'); }
function showQuestionForm() {
    if (!currentUser) { showNotification('Connectez-vous', 'error'); return; }
    hideForms();
    document.getElementById('questionForm').classList.add('active');
    updateCategories();
}
async function showHistory() {
    if (!currentUser) { showNotification('Connectez-vous', 'error'); return; }
    hideForms();
    await renderHistory();
    document.getElementById('historyForm').classList.add('active');
}
function hideForms() { document.querySelectorAll('.form-container').forEach(function(f) { f.classList.remove('active'); }); }
function goToAdmin() { window.location.href = '/admin'; }

function updateCategories() {
    var domain = document.getElementById('qDomain').value;
    var cats = categoriesByDomain[domain] || [];
    var sel = document.getElementById('qCategory');
    sel.innerHTML = '';
    cats.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
    });
}

async function login() {
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;
    var user = await apiPost('/login', { email: email, password: password });
    if (user && !user.error) {
        currentUser = user;
        saveSession();
        updateUI();
        hideForms();
        showNotification('🍃 Connecté ! Historique MongoDB restauré', 'mongo');
        await loadQuestions();
    } else showNotification('❌ Identifiants incorrects', 'error');
}

async function register() {
    var username = document.getElementById('regUsername').value;
    var email = document.getElementById('regEmail').value;
    var password = document.getElementById('regPassword').value;
    var domain = document.getElementById('regDomain').value;
    if (!username || !email || !password) { showNotification('Remplir tous les champs', 'error'); return; }
    if (password.length < 6) { showNotification('6 caractères min', 'error'); return; }
    var newUser = await apiPost('/users', { username: username, email: email, password: password, role: 'user', language: 'fr', domain: domain });
    if (newUser && !newUser.error) {
        currentUser = newUser;
        saveSession();
        updateUI();
        hideForms();
        showNotification('🍃 Inscription réussie ! Sauvegardée dans MongoDB', 'mongo');
        await loadQuestions();
    } else showNotification('❌ ' + (newUser ? newUser.error : 'Erreur'), 'error');
}

function logout() {
    if (!confirm('Se déconnecter ?')) return;
    currentUser = null;
    saveSession();
    updateUI();
    showNotification('🚪 Déconnecté', 'info');
}

function updateUI() {
    if (currentUser) {
        document.getElementById('authButtons').style.display = 'none';
        document.getElementById('userActions').style.display = 'flex';
        document.getElementById('userDisplay').innerHTML = '<span class="user-avatar">' + currentUser.username[0].toUpperCase() + '</span> <span>' + currentUser.username + '</span>';
        document.getElementById('newQuestionBtn').style.display = 'inline-block';
        document.getElementById('userRole').innerHTML = '👤 ' + currentUser.username;
        if (currentUser.role === 'admin') document.getElementById('adminBtn').style.display = 'inline-block';
    } else {
        document.getElementById('authButtons').style.display = 'flex';
        document.getElementById('userActions').style.display = 'none';
        document.getElementById('newQuestionBtn').style.display = 'none';
        document.getElementById('adminBtn').style.display = 'none';
        document.getElementById('userRole').innerHTML = '👤 Visiteur';
    }
    document.getElementById('scholarCount').textContent = '🎓 ' + scholarsData.length + ' Scholars';
}

async function renderHistory() {
    var container = document.getElementById('historyList');
    var stats = document.getElementById('historyStats');
    var all = await apiGet('/questions') || [];
    var mine = all.filter(function(q) { return q.username === currentUser.username; });
    var myAnswers = 0;
    all.forEach(function(q) { if (q.answers) q.answers.forEach(function(a) { if (a.username === currentUser.username) myAnswers++; }); });
    var hist = await apiGet('/history/' + currentUser.id) || [];
    stats.innerHTML = '<span style="background:rgba(255,255,255,0.1);padding:5px 12px;border-radius:12px;">📋 ' + mine.length + ' questions</span><span style="background:rgba(255,255,255,0.1);padding:5px 12px;border-radius:12px;">💬 ' + myAnswers + ' réponses</span><span style="background:rgba(255,255,255,0.1);padding:5px 12px;border-radius:12px;">📊 ' + hist.length + ' actions</span>';
    if (mine.length === 0) { container.innerHTML = '<p style="text-align:center;opacity:0.5;padding:30px;">Aucune question.</p>'; return; }
    var html = '';
    mine.forEach(function(q) {
        html += '<div class="question-card" style="margin:10px 0;"><div class="question-title">' + getDomainIcon(q.domain) + ' ' + q.title + '</div><div class="question-meta"><span class="domain-tag">' + q.domain + '</span> | ' + q.category + ' | ' + q.date + '</div><div class="question-content">' + q.content + '</div>';
        if (q.answers && q.answers.length > 0) {
            html += '<div class="answers-section"><strong>💬 ' + q.answers.length + ' réponses</strong>';
            q.answers.forEach(function(a) {
                var cls = a.isClaude ? 'claude-answer' : (a.isScholarResponse ? 'scholar-answer' : '');
                html += '<div class="answer-item ' + cls + '"><div class="claude-response">' + a.content + '</div><div class="answer-meta">👤 ' + a.username + ' | ' + a.date + '</div></div>';
            });
            html += '</div>';
        }
        html += '</div>';
    });
    container.innerHTML = html;
}

async function askQuestion() {
    if (!currentUser) return;
    var domain = document.getElementById('qDomain').value;
    var category = document.getElementById('qCategory').value;
    var title = document.getElementById('qTitle').value;
    var content = document.getElementById('qContent').value;
    if (!title || !content) { showNotification('Titre et contenu obligatoires', 'error'); return; }
    var scholar = assignScholar(domain, category);
    var q = await apiPost('/questions', {
        title: title, content: content, domain: domain, category: category,
        username: currentUser.username, userId: currentUser.id,
        language: 'fr', date: new Date().toLocaleDateString('fr-FR'),
        status: scholar ? 'assigned' : 'pending',
        scholar: scholar, answers: []
    });
    if (q && !q.error) {
        await apiPost('/history', { userId: currentUser.id, username: currentUser.username, action: 'question', data: { title: title } });
        showNotification('🍃 Question sauvegardée dans MongoDB !', 'mongo');
        hideForms();
        await loadQuestions();
        triggerClaudeJudge(q);
        document.getElementById('qTitle').value = '';
        document.getElementById('qContent').value = '';
    }
}

async function loadQuestions() {
    var data = await apiGet('/questions');
    if (data) { questions = data; renderQuestions(); }
}

function renderQuestions() {
    var container = document.getElementById('questionsContainer');
    var filtered = currentFilter === 'all' ? questions : questions.filter(function(q) { return q.domain === currentFilter; });
    document.getElementById('questionCount').textContent = '📋 ' + questions.length + ' questions';
    if (filtered.length === 0) { container.innerHTML = '<p style="text-align:center;opacity:0.5;padding:40px;">Aucune question.</p>'; return; }
    var html = '';
    filtered.forEach(function(q) {
        var hasClaude = q.answers && q.answers.some(function(a) { return a.isClaude; });
        var cardClass = hasClaude ? 'claude-card' : '';
        var stClass = q.status === 'claude_answered' ? 'badge-claude' : (q.status === 'assigned' ? 'badge-assigned' : q.status === 'answered' ? 'badge-answered' : 'badge-pending');
        var stLabel = q.status === 'claude_answered' ? '🤖 Claude' : (q.status === 'assigned' ? 'Assigné' : q.status === 'answered' ? 'Répondu' : 'En attente');
        var answersHtml = '';
        if (q.answers && q.answers.length > 0) {
            answersHtml = '<div class="answers-section"><strong>💬 ' + q.answers.length + ' réponses</strong>';
            q.answers.forEach(function(a) {
                var aCls = a.isClaude ? 'claude-answer' : (a.isScholarResponse ? 'scholar-answer' : '');
                var badge = '';
                if (a.isClaude) { badge = '<span class="claude-badge">🤖 Juge Claude</span> '; if (a.claudeReason === 'no_literature') badge += '<span class="claude-status">Sans littérature</span>'; if (a.claudeReason === 'timeout_5min') badge += '<span class="timer-badge">⏱️ 5 min</span>'; }
                answersHtml += '<div class="answer-item ' + aCls + '"><div style="margin-bottom:5px;">' + badge + '</div><div class="claude-response">' + a.content + '</div><div class="answer-meta">👤 ' + a.username + ' | ' + a.date + '</div></div>';
            });
            answersHtml += '</div>';
        } else answersHtml = '<div style="margin-top:10px;opacity:0.5;font-size:13px;">💬 En attente...</div>';
        var ansBtn = currentUser ? '<button class="btn btn-secondary" onclick="showAnswerForm(\'' + q._id + '\')">💬 Répondre</button>' : '';
        html += '<div class="question-card ' + cardClass + '"><div class="question-title">' + getDomainIcon(q.domain) + ' ' + q.title + '</div><div class="question-meta"><span class="domain-tag">' + q.domain + '</span> 👤 ' + q.username + ' | ' + q.category + ' | ' + q.date + ' | <span class="badge ' + stClass + '">' + stLabel + '</span></div><div class="question-content">' + q.content + '</div><div class="question-actions">' + ansBtn + '</div>' + answersHtml + '</div>';
    });
    container.innerHTML = html;
}

async function showAnswerForm(questionId) {
    if (!currentUser) return;
    var content = prompt('Votre réponse :');
    if (!content) return;
    var isScholar = scholarsData.some(function(s) { return s.name === currentUser.username; });
    await apiPost('/questions/' + questionId + '/answers', {
        username: currentUser.username, userId: currentUser.id,
        content: content, language: 'fr', date: new Date().toLocaleDateString('fr-FR'),
        aiVerified: isScholar, isScholarResponse: isScholar
    });
    await apiPost('/history', { userId: currentUser.id, username: currentUser.username, action: 'answer', data: { content: content.substring(0, 50) } });
    showNotification('🍃 Réponse sauvegardée dans MongoDB !', 'mongo');
    await loadQuestions();
}

async function loadData() { await loadQuestions(); showNotification('🍃 Actualisé depuis MongoDB', 'mongo'); }

initializeApp();
</script>
