<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شولارز كونكت - Scholars Connect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
            background: #0a0e27;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-ar { font-size: 28px; font-family: 'Traditional Arabic', 'Amiri', serif; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            font-size: 14px;
        }
        .btn-primary { background: #10b981; color: white; }
        .btn-success { background: #22c55e; color: #0a0e27; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn-admin { background: #f59e0b; color: #0a0e27; }
        .btn-scholar { background: #8b5cf6; color: white; }
        .btn-islam { background: #059669; color: white; }
        .btn-arabic { background: #1a7a5a; color: white; }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }

        .form-container {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            margin: 20px 0;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .form-container.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; opacity: 0.8; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 14px;
        }
        .form-group input[type="text"]:lang(ar), .form-group textarea:lang(ar) {
            font-family: 'Traditional Arabic', 'Amiri', 'Arial', serif;
            font-size: 18px;
            direction: rtl;
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group select option { background: #1a1a2e; color: white; }

        /* Clavier arabe virtuel */
        .keyboard-container {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .keyboard-container.active { display: block; }
        .keyboard-row { display: flex; gap: 4px; margin: 4px 0; justify-content: center; flex-wrap: wrap; }
        .key-btn {
            min-width: 40px;
            padding: 8px 6px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            font-size: 18px;
            transition: 0.2s;
            text-align: center;
        }
        .key-btn:hover { background: rgba(16,185,129,0.3); transform: scale(1.05); }
        .key-btn.space { min-width: 80px; }
        .key-btn.shift { min-width: 60px; font-size: 14px; }

        .status-bar {
            display: flex;
            gap: 20px;
            padding: 15px 0;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .status-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .user-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #10b981;
            font-weight: 700;
            margin-right: 10px;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }

        .question-grid { display: grid; gap: 20px; margin: 20px 0; }
        .question-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.3s;
        }
        .question-card:hover { transform: translateY(-2px); border-color: #10b981; }
        .question-title { font-size: 18px; font-weight: 600; color: #10b981; }
        .question-meta { font-size: 13px; opacity: 0.6; margin: 5px 0; display: flex; gap: 15px; flex-wrap: wrap; }
        .question-content { margin: 10px 0; }
        .question-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        .answers-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .answer-item {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            border-left: 3px solid #10b981;
        }
        .answer-meta { font-size: 12px; opacity: 0.6; display: flex; gap: 15px; flex-wrap: wrap; }
        .scholar-tag {
            background: #8b5cf6;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            display: inline-block;
        }
        .islam-tag {
            background: #059669;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            display: inline-block;
        }
        .arabic-text { font-family: 'Traditional Arabic', 'Amiri', serif; font-size: 18px; direction: rtl; }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s;
            max-width: 90%;
        }
        .notification.success { background: #22c55e; color: #0a0e27; display: block; }
        .notification.error { background: #ef4444; color: white; display: block; }
        .notification.info { background: #3b82f6; color: white; display: block; }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-pending { background: #eab308; color: #0a0e27; }
        .badge-answered { background: #22c55e; color: #0a0e27; }
        .badge-assigned { background: #8b5cf6; color: white; }
        .badge-islam { background: #059669; color: white; }

        .dir-ltr { direction: ltr; }
        .dir-rtl { direction: rtl; font-family: 'Traditional Arabic', 'Amiri', serif; }
        .text-center { text-align: center; }

        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: stretch; }
            .header-actions { flex-wrap: wrap; }
            .header-actions button { flex: 1; text-align: center; }
            .key-btn { min-width: 32px; padding: 6px 4px; font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="container">

                <button class="key-btn" onclick="insertChar('ن')">ن</button>

            <div class="keyboard-row">

                <button class="key-btn" onclick="insertChar('إ')">إ</button>
                <button class="key-btn" onclick="insertChar('أ')">أ</button>
                <button class="key-btn" onclick="insertChar('آ')">آ</button>

<script>
// ============================================================
// DONNÉES
// ============================================================
var users = [
    { id: 1, username: 'مدير', email: 'admin@scholars-connect.com', password: 'admin12345', role: 'admin', language: 'ar', religion: 'Islam' }
];

var scholarsData = [
    { id: 1, name: 'د. أحمد الفقيه', expertise: 'Fiqh (الفقه)', languages: ['ar', 'fr', 'en'], rating: 4.9, speciality: 'Islam' },
    { id: 2, name: 'د. فاطمة العقيدة', expertise: 'Aqida (العقيدة)', languages: ['ar', 'fr', 'en'], rating: 4.8, speciality: 'Islam' },
    { id: 3, name: 'د. عمر الحديث', expertise: 'Hadith (الحديث)', languages: ['ar', 'en', 'fr'], rating: 4.9, speciality: 'Islam' },
    { id: 4, name: 'د. ليلى التفسير', expertise: 'Tafsir (التفسير)', languages: ['ar', 'fr', 'en'], rating: 4.7, speciality: 'Islam' },
    { id: 5, name: 'د. يوسف السيرة', expertise: 'Sira (السيرة)', languages: ['ar', 'en', 'fr'], rating: 4.6, speciality: 'Islam' },
    { id: 6, name: 'د. خديجة التصوف', expertise: 'Soufisme (التصوف)', languages: ['ar', 'fr', 'en'], rating: 4.5, speciality: 'Islam' },
    { id: 7, name: 'د. أميرة الرياضيات', expertise: 'Mathématiques', languages: ['ar', 'fr', 'en'], rating: 4.9, speciality: 'Général' },
    { id: 8, name: 'د. صوفي الفيزياء', expertise: 'Physique', languages: ['ar', 'fr', 'en'], rating: 4.8, speciality: 'Général' },
    { id: 9, name: 'د. كريم المعلوماتية', expertise: 'Informatique', languages: ['ar', 'fr', 'en', 'es'], rating: 4.7, speciality: 'Général' }
];

var questions = [];
var currentUser = null;
var currentLanguage = localStorage.getItem('prefLang') || 'ar';
var isKeyboardActive = false;

var translations = {
    'ar': {
        title: 'شولارز كونكت',
        subtitle: 'منصة المساعدة الأكاديمية',
        login: 'تسجيل الدخول',
        register: 'إنشاء حساب',
        ask: 'طرح سؤال',
        refresh: 'تحديث',
        scholars: 'العلماء',
        language: 'اللغة',
        keyboard: 'لوحة المفاتيح العربية',
        online: 'متصل',
        visitor: 'زائر',
        questions: 'سؤال',
        scholarsLabel: 'علماء'
    },
    'fr': {
        title: 'Scholars Connect',
        subtitle: 'Plateforme d\'entraide académique',
        login: 'Connexion',
        register: 'Inscription',
        ask: 'Poser une question',
        refresh: 'Rafraîchir',
        scholars: 'Scholars',
        language: 'Langue',
        keyboard: 'Clavier arabe',
        online: 'En ligne',
        visitor: 'Visiteur',
        questions: 'questions',
        scholarsLabel: 'Scholars'
    },
    'en': {
        title: 'Scholars Connect',
        subtitle: 'Academic Help Platform',
        login: 'Login',
        register: 'Register',
        ask: 'Ask a question',
        refresh: 'Refresh',
        scholars: 'Scholars',
        language: 'Language',
        keyboard: 'Arabic Keyboard',
        online: 'Online',
        visitor: 'Visitor',
        questions: 'questions',
        scholarsLabel: 'Scholars'
    }
};

// ============================================================
// CLAVIER ARABE
// ============================================================
function toggleKeyboard() {
    var keyboard = document.getElementById('arabicKeyboard');
    isKeyboardActive = !isKeyboardActive;
    if (isKeyboardActive) {
        keyboard.classList.add('active');
        showNotification('⌨️ Clavier arabe activé', 'info');
    } else {
        keyboard.classList.remove('active');
        showNotification('⌨️ Clavier arabe désactivé', 'info');
    }
}

function insertChar(char) {
    var activeElement = document.activeElement;
    if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
        var start = activeElement.selectionStart;
        var end = activeElement.selectionEnd;
        var value = activeElement.value;
        activeElement.value = value.substring(0, start) + char + value.substring(end);
        activeElement.selectionStart = activeElement.selectionEnd = start + char.length;
        activeElement.focus();
    } else {
        // Si aucun champ n'est actif, ajouter au champ de question
        var contentField = document.getElementById('qContent');
        if (contentField) {
            contentField.value += char;
            contentField.focus();
        }
    }
}

function clearText() {
    var activeElement = document.activeElement;
    if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
        var value = activeElement.value;
        activeElement.value = value.substring(0, value.length - 1);
        activeElement.focus();
    }
}

// ============================================================
// LANGUES
// ============================================================
function toggleLanguage() {
    var langs = ['ar', 'fr', 'en', 'es', 'de', 'it', 'pt'];
    var currentIndex = langs.indexOf(currentLanguage);
    var nextIndex = (currentIndex + 1) % langs.length;
    currentLanguage = langs[nextIndex];
    localStorage.setItem('prefLang', currentLanguage);
    document.getElementById('langDisplay').innerHTML = '🌐 اللغة: ' + getLangName(currentLanguage);
    updateLanguageUI();
    showNotification('Langue changée: ' + getLangName(currentLanguage), 'info');
    renderQuestions();
}

function getLangName(code) {
    var names = { ar: 'العربية', fr: 'Français', en: 'English', es: 'Español', de: 'Deutsch', it: 'Italiano', pt: 'Português' };
    return names[code] || code;
}

function updateLanguageUI() {
    var t = translations[currentLanguage] || translations['ar'];
    document.getElementById('statusText').textContent = t.online;
    document.getElementById('userRole').textContent = currentUser ? '👤 ' + currentUser.username : '👤 ' + t.visitor;
    document.getElementById('questionCount').textContent = '📋 ' + questions.length + ' ' + t.questions;
    document.getElementById('scholarCount').textContent = '🎓 ' + scholarsData.length + ' ' + t.scholarsLabel;
}

// ============================================================
// SCHOLARS
// ============================================================
function assignScholar(category) {
    var islamicCategories = ['Fiqh (الفقه)', 'Aqida (العقيدة)', 'Hadith (الحديث)', 'Tafsir (التفسير)', 'Sira (السيرة)', 'Soufisme (التصوف)'];
    var isIslamic = islamicCategories.indexOf(category) !== -1;
    
    var available = scholarsData.filter(function(s) {
        if (isIslamic) {
            return s.speciality === 'Islam' && s.expertise === category;
        }
        return s.speciality === 'Général' && s.expertise === category;
    });
    
    if (available.length > 0) {
        return available[Math.floor(Math.random() * available.length)];
    }
    var fallback = scholarsData.filter(function(s) { return s.expertise === category; });
    if (fallback.length > 0) return fallback[0];
    return null;
}

function showScholars() {
    var container = document.getElementById('scholarsList');
    var html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin:15px 0;">';
    for (var i = 0; i < scholarsData.length; i++) {
        var s = scholarsData[i];
        var isIslamic = s.speciality === 'Islam';
        var borderColor = isIslamic ? '#059669' : '#667eea';
        var tag = isIslamic ? '<span class="islam-tag">🕌 إسلام</span>' : '<span class="scholar-tag">📚 عام</span>';
        html += '<div style="background:rgba(255,255,255,0.05);padding:15px;border-radius:10px;border:1px solid ' + borderColor + ';">' +
            '<strong>' + s.name + '</strong> ' + tag +
            '<div style="opacity:0.7;font-size:14px;">📂 ' + s.expertise + '</div>' +
            '<div style="font-size:13px;opacity:0.6;">🌐 ' + s.languages.map(function(l) { return getLangName(l); }).join(', ') + '</div>' +
            '<div style="color:#f59e0b;">⭐ ' + s.rating + '/5</div>' +
            '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
    hideForms();
    document.getElementById('scholarsPopup').classList.add('active');
}

// ============================================================
// NOTIFICATIONS
// ============================================================
function showNotification(message, type) {
    if (type === undefined) type = 'info';
    var el = document.getElementById('notification');
    el.textContent = message;
    el.className = 'notification ' + type;
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 5000);
}

// ============================================================
// FORMULAIRES
// ============================================================
function showLogin() { hideForms(); document.getElementById('loginForm').classList.add('active'); }
function showRegister() { hideForms(); document.getElementById('registerForm').classList.add('active'); }
function showQuestionForm() {
    if (!currentUser) { showNotification('Veuillez vous connecter', 'error'); return; }
    hideForms();
    document.getElementById('questionForm').classList.add('active');
    if (isKeyboardActive) document.getElementById('arabicKeyboard').classList.add('active');
}
function hideForms() {
    var forms = document.querySelectorAll('.form-container');
    for (var i = 0; i < forms.length; i++) {
        forms[i].classList.remove('active');
    }
    document.getElementById('arabicKeyboard').classList.remove('active');
}
function goToAdmin() { window.location.href = '/admin'; }

// ============================================================
// AUTHENTIFICATION
// ============================================================
function login() {
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;
    
    var user = null;
    for (var i = 0; i < users.length; i++) {
        if (users[i].email === email && users[i].password === password) {
            user = users[i];
            break;
        }
    }
    
    if (user) {
        currentUser = user;
        if (user.language) currentLanguage = user.language;
        updateUI();
        hideForms();
        showNotification('✅ تم تسجيل الدخول بنجاح !', 'success');
        renderQuestions();
    } else {
        showNotification('❌ البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error');
    }
}

function register() {
    var username = document.getElementById('regUsername').value;
    var email = document.getElementById('regEmail').value;
    var password = document.getElementById('regPassword').value;
    var language = document.getElementById('regLanguage').value;
    var religion = document.getElementById('regReligion').value;
    
    if (!username || !email || !password) {
        showNotification('❌ الرجاء ملء جميع الحقول', 'error');
        return;
    }
    if (password.length < 6) {
        showNotification('❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
        return;
    }
    
    var exists = false;
    for (var i = 0; i < users.length; i++) {
        if (users[i].email === email) { exists = true; break; }
    }
    if (exists) { showNotification('❌ هذا البريد الإلكتروني مستخدم بالفعل', 'error'); return; }
    
    var newUser = {
        id: users.length + 1,
        username: username,
        email: email,
        password: password,
        role: 'user',
        language: language,
        religion: religion
    };
    users.push(newUser);
    currentUser = newUser;
    currentLanguage = language;
    updateUI();
    hideForms();
    showNotification('✅ تم إنشاء الحساب بنجاح !', 'success');
    renderQuestions();
}

function logout() {
    currentUser = null;
    updateUI();
    showNotification('تم تسجيل الخروج', 'info');
}

function updateUI() {
    if (currentUser) {
        document.getElementById('authButtons').style.display = 'none';
        document.getElementById('userActions').style.display = 'flex';
        var religionIcon = { 'Islam': '🕌', 'Chrétien': '✝️', 'Juif': '✡️', 'Autre': '🌍' };
        var icon = religionIcon[currentUser.religion] || '👤';
        document.getElementById('userDisplay').innerHTML =
            '<span class="user-avatar">' + currentUser.username[0].toUpperCase() + '</span> ' +
            '<span>' + currentUser.username + '</span>' +
            '<span style="opacity:0.6;font-size:12px;">(' + currentUser.role + ' ' + icon + ')</span>';
        document.getElementById('newQuestionBtn').style.display = 'inline-block';
        if (currentUser.role === 'admin') {
            document.getElementById('adminBtn').style.display = 'inline-block';
        }
    } else {
        document.getElementById('authButtons').style.display = 'flex';
        document.getElementById('userActions').style.display = 'none';
        document.getElementById('newQuestionBtn').style.display = 'none';
        document.getElementById('adminBtn').style.display = 'none';
    }
    updateLanguageUI();
    document.getElementById('langDisplay').innerHTML = '🌐 اللغة: ' + getLangName(currentLanguage);
}

// ============================================================
// QUESTIONS
// ============================================================
function askQuestion() {
    if (!currentUser) { showNotification('❌ الرجاء تسجيل الدخول أولاً', 'error'); return; }
    var title = document.getElementById('qTitle').value;
    var category = document.getElementById('qCategory').value;
    var content = document.getElementById('qContent').value;
    var language = document.getElementById('qLanguage').value;
    
    if (!title || !content) { showNotification('❌ العنوان والمحتوى مطلوبان', 'error'); return; }
    
    var scholar = assignScholar(category);
    var isIslamic = ['Fiqh (الفقه)', 'Aqida (العقيدة)', 'Hadith (الحديث)', 'Tafsir (التفسير)', 'Sira (السيرة)', 'Soufisme (التصوف)'].indexOf(category) !== -1;
    
    questions.unshift({
        id: questions.length + 1,
        title: title,
        category: category,
        content: content,
        username: currentUser.username,
        language: language,
        date: new Date().toLocaleDateString(),
        status: scholar ? 'assigned' : 'pending',
        scholar: scholar,
        isIslamic: isIslamic,
        answers: []
    });
    
    var message = '✅ تم نشر السؤال ! ';
    if (scholar) {
        message += 'تم تعيين العالم: ' + scholar.name;
        if (isIslamic) message += ' 🕌 (إسلام)';
    } else {
        message += 'في انتظار عالم متاح';
    }
    showNotification(message, 'success');
    hideForms();
    renderQuestions();
    document.getElementById('qTitle').value = '';
    document.getElementById('qContent').value = '';
}

function renderQuestions() {
    var container = document.getElementById('questionsContainer');
    document.getElementById('questionCount').textContent = '📋 ' + questions.length + ' ' + (currentLanguage === 'ar' ? 'سؤال' : 'questions');
    document.getElementById('scholarCount').textContent = '🎓 ' + scholarsData.length + ' ' + (currentLanguage === 'ar' ? 'علماء' : 'Scholars');
    
    if (questions.length === 0) {
        container.innerHTML = '<p style="text-align:center;opacity:0.5;padding:40px;">' + 
            (currentLanguage === 'ar' ? 'لا توجد أسئلة. كن أول من يطرح سؤالاً !' : 'Aucune question. Posez la première !') + '</p>';
        return;
    }
    
    var html = '';
    for (var i = 0; i < questions.length; i++) {
        var q = questions[i];
        var isArabic = q.language === 'ar';
        var dirClass = isArabic ? 'dir-rtl' : 'dir-ltr';
        
        var statusClass = q.status === 'assigned' ? 'badge-assigned' : q.status === 'answered' ? 'badge-answered' : 'badge-pending';
        var statusLabel = q.status === 'assigned' ? (currentLanguage === 'ar' ? 'تم التعيين' : 'Assigné') : 
                          q.status === 'answered' ? (currentLanguage === 'ar' ? 'تم الرد' : 'Répondu') : 
                          (currentLanguage === 'ar' ? 'قيد الانتظار' : 'En attente');
        
        var scholarInfo = '';
        if (q.scholar) {
            var tag = q.isIslamic ? '<span class="islam-tag">🕌 إسلام</span>' : '<span class="scholar-tag">📚 عام</span>';
            scholarInfo = '<span class="scholar-tag">🎓 ' + q.scholar.name + '</span> ' + tag;
        }
        
        var islamicBadge = q.isIslamic ? '<span class="badge badge-islam">🕌 إسلام</span>' : '';
        
        var answersHtml = '';
        if (q.answers && q.answers.length > 0) {
            answersHtml = '<div class="answers-section"><strong>💬 ' + q.answers.length + ' ' + 
                (currentLanguage === 'ar' ? 'ردود' : 'réponses') + '</strong>';
            for (var j = 0; j < q.answers.length; j++) {
                var a = q.answers[j];
                var isScholar = scholarsData.some(function(s) { return s.name === a.username; });
                var aIsArabic = a.language === 'ar';
                var aDir = aIsArabic ? 'dir-rtl' : 'dir-ltr';
                answersHtml += '<div class="answer-item ' + aDir + '">' +
                    '<div>' + a.content + '</div>' +
                    '<div class="answer-meta">' +
                    '👤 ' + a.username + (isScholar ? ' 🎓' : '') +
                    ' | 🌐 ' + getLangName(a.language || 'fr') +
                    (a.aiVerified ? ' | ✅ ' + (currentLanguage === 'ar' ? 'تم التحقق بواسطة AI' : 'Vérifié par AI') : '') +
                    '</div></div>';
            }
            answersHtml += '</div>';
        } else {
            answersHtml = '<div style="margin-top:10px;opacity:0.5;font-size:13px;">💬 ' + 
                (currentLanguage === 'ar' ? 'لا يوجد ردود حتى الآن' : 'Pas encore de réponse') + '</div>';
        }
        
        var answerBtn = '';
        if (currentUser) {
            answerBtn = '<button class="btn btn-secondary" onclick="showAnswerForm(' + q.id + ')">💬 ' + 
                (currentLanguage === 'ar' ? 'رد' : 'Répondre') + '</button>';
        }
        
        html += '<div class="question-card">' +
            '<div class="question-title ' + dirClass + '">' + q.title + ' ' + islamicBadge + '</div>' +
            '<div class="question-meta">' +
            '👤 ' + q.username +
            ' | 📂 ' + q.category +
            ' | 🌐 ' + getLangName(q.language) +
            ' | 📅 ' + q.date +
            ' | <span class="badge ' + statusClass + '">' + statusLabel + '</span>' +
            ' ' + scholarInfo +
            '</div>' +
            '<div class="question-content ' + dirClass + '">' + q.content + '</div>' +
            '<div class="question-actions">' + answerBtn + '</div>' +
            answersHtml +
            '</div>';
    }
    container.innerHTML = html;
}

function showAnswerForm(questionId) {
    if (!currentUser) { showNotification('Veuillez vous connecter', 'error'); return; }
    var content = prompt('Votre réponse :');
    if (!content) return;
    
    var lang = prompt('Langue (fr/en/ar/es/de/it/pt) :', currentLanguage || 'ar') || currentLanguage || 'fr';
    
    for (var i = 0; i < questions.length; i++) {
        if (questions[i].id === questionId) {
            if (!questions[i].answers) questions[i].answers = [];
            var isScholar = scholarsData.some(function(s) { return s.name === currentUser.username; });
            questions[i].answers.push({
                username: currentUser.username,
                content: content,
                language: lang,
                aiVerified: isScholar ? true : false,
                isScholar: isScholar
            });
            if (isScholar) {
                questions[i].status = 'answered';
            }
            showNotification('✅ Réponse publiée !' + (isScholar ? ' ✅ Vérifiée par AI' : ''), 'success');
            renderQuestions();
            break;
        }
    }
}

function loadData() {
    renderQuestions();
    showNotification('✅ Données actualisées', 'info');
}

// ============================================================
// INITIALISATION
// ============================================================
renderQuestions();
updateLanguageUI();
</script>
