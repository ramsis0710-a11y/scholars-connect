<!DOCTYPE html>
<html lang="fr" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholars Connect - Multi-Domaines</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
            background: #0a0e27;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #667eea;
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #10b981, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-sub { font-size: 14px; opacity: 0.6; display: block; font-weight: 400; }
        
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            font-size: 13px;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #22c55e; color: #0a0e27; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn-admin { background: #f59e0b; color: #0a0e27; }
        .btn-islam { background: #059669; color: white; }
        .btn-medical { background: #ef4444; color: white; }
        .btn-pharma { background: #f472b6; color: white; }
        .btn-chimie { background: #06b6d4; color: white; }
        .btn-ia { background: #8b5cf6; color: white; }
        .btn-iot { background: #14b8a6; color: white; }
        .btn-gmao { background: #f59e0b; color: #0a0e27; }
        .btn-meca { background: #78716c; color: white; }
        .btn-arabic { background: #1a7a5a; color: white; }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }

        /* CATEGORIES NAV */
        .categories-nav {
            display: flex;
            gap: 10px;
            padding: 15px 0;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            overflow-x: auto;
        }
        .cat-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
            white-space: nowrap;
        }
        .cat-btn:hover { background: rgba(255,255,255,0.1); }
        .cat-btn.active { background: #667eea; border-color: #667eea; }

        .form-container {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            margin: 20px 0;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .form-container.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; opacity: 0.8; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 14px;
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group select option, .form-group select optgroup { background: #1a1a2e; color: white; }

        /* Clavier arabe */
        .keyboard-container {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .keyboard-container.active { display: block; }
        .keyboard-row { display: flex; gap: 4px; margin: 4px 0; justify-content: center; flex-wrap: wrap; }
        .key-btn {
            min-width: 40px;
            padding: 8px 6px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            font-size: 18px;
            transition: 0.2s;
            text-align: center;
        }
        .key-btn:hover { background: rgba(16,185,129,0.3); transform: scale(1.05); }
        .key-btn.space { min-width: 80px; }
        .key-btn.shift { min-width: 60px; font-size: 14px; }

        .status-bar {
            display: flex;
            gap: 20px;
            padding: 15px 0;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .status-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .user-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-weight: 700;
            margin-right: 10px;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }

        .question-grid { display: grid; gap: 20px; margin: 20px 0; }
        .question-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.3s;
        }
        .question-card:hover { transform: translateY(-2px); border-color: #667eea; }
        .question-title { font-size: 18px; font-weight: 600; color: #667eea; }
        .question-meta { font-size: 13px; opacity: 0.6; margin: 5px 0; display: flex; gap: 15px; flex-wrap: wrap; }
        .question-content { margin: 10px 0; }
        .question-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        .answers-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .answer-item {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            border-left: 3px solid #667eea;
        }
        .answer-meta { font-size: 12px; opacity: 0.6; display: flex; gap: 15px; flex-wrap: wrap; }

        .domain-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 5px;
        }
        .domain-islam { background: #059669; color: white; }
        .domain-medecine { background: #ef4444; color: white; }
        .domain-pharmacie { background: #f472b6; color: white; }
        .domain-chimie { background: #06b6d4; color: white; }
        .domain-ia { background: #8b5cf6; color: white; }
        .domain-iot { background: #14b8a6; color: white; }
        .domain-gmao { background: #f59e0b; color: #0a0e27; }
        .domain-meca { background: #78716c; color: white; }
        .domain-general { background: #667eea; color: white; }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s;
            max-width: 90%;
        }
        .notification.success { background: #22c55e; color: #0a0e27; display: block; }
        .notification.error { background: #ef4444; color: white; display: block; }
        .notification.info { background: #3b82f6; color: white; display: block; }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-pending { background: #eab308; color: #0a0e27; }
        .badge-answered { background: #22c55e; color: #0a0e27; }
        .badge-assigned { background: #8b5cf6; color: white; }

        .dir-ltr { direction: ltr; }
        .dir-rtl { direction: rtl; font-family: 'Traditional Arabic', 'Amiri', serif; }

        .scholar-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .scholar-card:hover { transform: translateY(-3px); border-color: #667eea; }

        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: stretch; }
            .header-actions { flex-wrap: wrap; }
            .header-actions button { flex: 1; text-align: center; font-size: 11px; padding: 8px 12px; }
            .key-btn { min-width: 32px; padding: 6px 4px; font-size: 14px; }
            .cat-btn { font-size: 11px; padding: 6px 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="notification" id="notification"></div>

    <div class="header">
        <div>
            <div class="logo">🎓 Scholars Connect</div>
            <span class="logo-sub">🌍 8 domaines · 36 Scholars · 7 langues</span>
        </div>
        <div class="header-actions" id="authButtons">
            <button class="btn btn-primary" onclick="showLogin()">🔐 Connexion</button>
            <button class="btn btn-success" onclick="showRegister()">📝 Inscription</button>
        </div>
        <div class="header-actions" id="userActions" style="display:none;">
            <span class="user-info" id="userDisplay"></span>
            <button class="btn btn-admin" onclick="goToAdmin()" id="adminBtn" style="display:none;">⚙️ Admin</button>
            <button class="btn btn-danger" onclick="logout()">🚪 Déconnexion</button>
        </div>
    </div>

    <div class="status-bar">
        <span class="status-item"><span class="dot"></span> En ligne</span>
        <span class="status-item" id="userRole">👤 Visiteur</span>
        <span class="status-item" id="langDisplay">🌐 Français</span>
        <span class="status-item" id="questionCount">📋 0 questions</span>
        <span class="status-item" id="scholarCount">🎓 36 Scholars</span>
    </div>

    <!-- NAVIGATION PAR DOMAINE -->
    <div class="categories-nav">
        <button class="cat-btn active" onclick="filterByDomain('all', this)">🌍 Tous</button>
        <button class="cat-btn" onclick="filterByDomain('Islam', this)">🕌 Islam</button>
        <button class="cat-btn" onclick="filterByDomain('Médecine', this)">🏥 Médecine</button>
        <button class="cat-btn" onclick="filterByDomain('Pharmacie', this)">💊 Pharmacie</button>
        <button class="cat-btn" onclick="filterByDomain('Chimie', this)">⚗️ Chimie</button>
        <button class="cat-btn" onclick="filterByDomain('IA', this)">🤖 IA</button>
        <button class="cat-btn" onclick="filterByDomain('IoT', this)">🌐 IoT</button>
        <button class="cat-btn" onclick="filterByDomain('GMAO', this)">🏭 GMAO/GPAO</button>
        <button class="cat-btn" onclick="filterByDomain('Mécanique Pétrole', this)">⚙️ Méca Pétrole</button>
        <button class="cat-btn" onclick="filterByDomain('Général', this)">📚 Général</button>
    </div>

    <div style="margin:15px 0;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="newQuestionBtn" onclick="showQuestionForm()" style="display:none;">✏️ Poser une question</button>
        <button class="btn btn-secondary" onclick="loadData()">🔄 Rafraîchir</button>
        <button class="btn btn-secondary" onclick="showScholars()">🎓 Voir les Scholars</button>
        <button class="btn btn-arabic" onclick="toggleLanguage()">🌐 Changer de langue</button>
        <button class="btn btn-arabic" onclick="toggleKeyboard()">⌨️ Clavier arabe</button>
    </div>

    <!-- FORMULAIRES -->
    <div class="form-container" id="loginForm">
        <h2>🔐 Connexion</h2>
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@scholars-connect.com"></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" id="loginPassword" placeholder="admin12345"></div>
        <button class="btn btn-primary" onclick="login()">Se connecter</button>
        <button class="btn btn-secondary" onclick="hideForms()">Fermer</button>
    </div>

    <div class="form-container" id="registerForm">
        <h2>📝 Inscription</h2>
        <div class="form-group"><label>Nom d'utilisateur</label><input type="text" id="regUsername" placeholder="Votre nom"></div>
        <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="votre@email.com"></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" id="regPassword" placeholder="Min 6 caractères"></div>
        <div class="form-group"><label>Domaine d'intérêt</label>
            <select id="regDomain">
                <option value="Islam">🕌 Islam</option>
                <option value="Médecine">🏥 Médecine</option>
                <option value="Pharmacie">💊 Pharmacie</option>
                <option value="Chimie">⚗️ Chimie</option>
                <option value="IA">🤖 Intelligence Artificielle</option>
                <option value="IoT">🌐 Internet des Objets</option>
                <option value="GMAO">🏭 GMAO/GPAO</option>
                <option value="Mécanique Pétrole">⚙️ Mécanique Pétrole</option>
                <option value="Général">📚 Général</option>
            </select>
        </div>
        <div class="form-group"><label>Langue préférée</label>
            <select id="regLanguage">
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
            </select>
        </div>
        <button class="btn btn-success" onclick="register()">S'inscrire</button>
        <button class="btn btn-secondary" onclick="hideForms()">Fermer</button>
    </div>

    <div class="form-container" id="questionForm">

            </select>
        </div>
        <div class="form-group"><label>Spécialité</label>

        </div>
        <div class="form-group"><label>Titre</label><input type="text" id="qTitle" placeholder="Titre de votre question"></div>
        <div class="form-group"><label>Contenu</label><textarea id="qContent" placeholder="Détaillez votre question..."></textarea></div>
        <div class="form-group"><label>Langue</label>

            </select>
        </div>

        <div class="keyboard-container" id="arabicKeyboard">
            <div class="keyboard-row">
                <button class="key-btn" onclick="insertChar('ض')">ض</button>
                <button class="key-btn" onclick="insertChar('ص')">ص</button>

                <button class="key-btn" onclick="insertChar('ج')">ج</button>

            </div>
            <div class="keyboard-row">
                <button class="key-btn" onclick="insertChar('ذ')">ذ</button>
                <button class="key-btn" onclick="insertChar('ش')">ش</button>
                <button class="key-btn" onclick="insertChar('س')">س</button>
                <button class="key-btn" onclick="insertChar('ي')">ي</button>
                <button class="key-btn" onclick="insertChar('ب')">ب</button>
                <button class="key-btn" onclick="insertChar('ل')">ل</button>
                <button class="key-btn" onclick="insertChar('ا')">ا</button>
                <button class="key-btn" onclick="insertChar('ت')">ت</button>
                <button class="key-btn" onclick="insertChar('ن')">ن</button>
                <button class="key-btn" onclick="insertChar('م')">م</button>
                <button class="key-btn" onclick="insertChar('ك')">ك</button>
                <button class="key-btn" onclick="insertChar('ظ')">ظ</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn" onclick="insertChar('ط')">ط</button>
                <button class="key-btn" onclick="insertChar('ز')">ز</button>
                <button class="key-btn" onclick="insertChar('ر')">ر</button>
                <button class="key-btn" onclick="insertChar('و')">و</button>
                <button class="key-btn" onclick="insertChar('ء')">ء</button>
                <button class="key-btn" onclick="insertChar('ئ')">ئ</button>
                <button class="key-btn" onclick="insertChar('ؤ')">ؤ</button>
                <button class="key-btn" onclick="insertChar('إ')">إ</button>
                <button class="key-btn" onclick="insertChar('أ')">أ</button>
                <button class="key-btn" onclick="insertChar('آ')">آ</button>
                <button class="key-btn" onclick="insertChar('ة')">ة</button>
                <button class="key-btn" onclick="insertChar('ى')">ى</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn space" onclick="insertChar(' ')">مسافة</button>
                <button class="key-btn" onclick="insertChar('؟')">؟</button>
                <button class="key-btn" onclick="insertChar('،')">،</button>
                <button class="key-btn" onclick="insertChar('؛')">؛</button>
                <button class="key-btn" onclick="clearText()">⌫ مسح</button>
            </div>
        </div>
        <button class="btn btn-success" onclick="askQuestion()">📤 Publier</button>
        <button class="btn btn-secondary" onclick="hideForms()">Fermer</button>
    </div>

    <!-- SCHOLARS POPUP -->
    <div class="form-container" id="scholarsPopup">
        <h2>🎓 Scholars disponibles</h2>
        <div id="scholarsList"></div>
        <button class="btn btn-secondary" onclick="hideForms()">Fermer</button>
    </div>

    <!-- QUESTIONS -->
    <div id="questionsContainer" class="question-grid"></div>
</div>

// ============================================================
// NAVIGATION PAR DOMAINE
// ============================================================
function filterByDomain(domain, btn) {
    currentFilter = domain;
    var btns = document.querySelectorAll('.cat-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    if (btn) btn.classList.add('active');
    renderQuestions();

// ============================================================
// CLAVIER ARABE
// ============================================================
function toggleKeyboard() {
    var keyboard = document.getElementById('arabicKeyboard');
    isKeyboardActive = !isKeyboardActive;
    if (isKeyboardActive) {
        keyboard.classList.add('active');
        showNotification('⌨️ Clavier arabe activé', 'info');
    } else {
        keyboard.classList.remove('active');
        showNotification('⌨️ Clavier arabe désactivé', 'info');
    }
}

function insertChar(char) {
    var activeElement = document.activeElement;
    if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
        var start = activeElement.selectionStart;
        var end = activeElement.selectionEnd;
        var value = activeElement.value;
        activeElement.value = value.substring(0, start) + char + value.substring(end);
        activeElement.selectionStart = activeElement.selectionEnd = start + char.length;
        activeElement.focus();
    } else {
        var contentField = document.getElementById('qContent');
        if (contentField) {
            contentField.value += char;
            contentField.focus();
        }
    }
}

function clearText() {
    var activeElement = document.activeElement;
    if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
        activeElement.value = activeElement.value.substring(0, activeElement.value.length - 1);
        activeElement.focus();
    }
}

// ============================================================
// LANGUES
// ============================================================
function toggleLanguage() {
    var langs = ['fr', 'ar', 'en', 'es', 'de', 'it', 'pt'];
    var idx = langs.indexOf(currentLanguage);
    currentLanguage = langs[(idx + 1) % langs.length];
    localStorage.setItem('prefLang', currentLanguage);
    document.getElementById('langDisplay').innerHTML = '🌐 ' + getLangName(currentLanguage);
    showNotification('Langue: ' + getLangName(currentLanguage), 'info');
}

function getLangName(code) {
    var names = { fr: 'Français', ar: 'العربية', en: 'English', es: 'Español', de: 'Deutsch', it: 'Italiano', pt: 'Português' };
    return names[code] || code;
}

// ============================================================
// SCHOLARS
// ============================================================
function assignScholar(domain, category) {
    var available = scholarsData.filter(function(s) {
        return s.domain === domain && s.expertise === category;
    });
    if (available.length > 0) {
        return available[Math.floor(Math.random() * available.length)];
    }
    var fallback = scholarsData.filter(function(s) { return s.expertise === category; });
    if (fallback.length > 0) return fallback[0];
    return null;
}

function getDomainClass(domain) {
    var map = {
        'Islam': 'domain-islam',
        'Médecine': 'domain-medecine',
        'Pharmacie': 'domain-pharmacie',
        'Chimie': 'domain-chimie',
        'IA': 'domain-ia',
        'IoT': 'domain-iot',
        'GMAO': 'domain-gmao',
        'Mécanique Pétrole': 'domain-meca',
        'Général': 'domain-general'
    };
    return map[domain] || 'domain-general';
}

function getDomainIcon(domain) {
    var icons = {
        'Islam': '🕌',
        'Médecine': '🏥',
        'Pharmacie': '💊',
        'Chimie': '⚗️',
        'IA': '🤖',
        'IoT': '🌐',
        'GMAO': '🏭',
        'Mécanique Pétrole': '⚙️',
        'Général': '📚'
    };
    return icons[domain] || '📖';
}

function showScholars() {
    var container = document.getElementById('scholarsList');
    var filtered = currentFilter === 'all' ? scholarsData : scholarsData.filter(function(s) { return s.domain === currentFilter; });
    
    var html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;margin:15px 0;">';
    for (var i = 0; i < filtered.length; i++) {
        var s = filtered[i];
        var dClass = getDomainClass(s.domain);
        var icon = getDomainIcon(s.domain);
        html += '<div class="scholar-card">' +
            '<strong>' + icon + ' ' + s.name + '</strong> ' +
            '<span class="domain-tag ' + dClass + '">' + s.domain + '</span>' +
            '<div style="opacity:0.7;font-size:14px;margin-top:5px;">📂 ' + s.expertise + '</div>' +
            '<div style="font-size:13px;opacity:0.6;">🌐 ' + s.languages.map(function(l) { return getLangName(l); }).join(', ') + '</div>' +
            '<div style="color:#f59e0b;">⭐ ' + s.rating + '/5</div>' +
            '</div>';
    }
    html += '</div>';
    html += '<p style="text-align:center;opacity:0.6;margin-top:15px;">📊 Total : ' + filtered.length + ' Scholars</p>';
    container.innerHTML = html;
    hideForms();
    document.getElementById('scholarsPopup').classList.add('active');
}

// ============================================================
// NOTIFICATIONS
// ============================================================
function showNotification(message, type) {
    if (type === undefined) type = 'info';
    var el = document.getElementById('notification');
    el.textContent = message;
    el.className = 'notification ' + type;
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 5000);
}

// ============================================================
// FORMULAIRES
// ============================================================
function showLogin() { hideForms(); document.getElementById('loginForm').classList.add('active'); }
function showRegister() { hideForms(); document.getElementById('registerForm').classList.add('active'); }
function showQuestionForm() {
    if (!currentUser) { showNotification('Veuillez vous connecter', 'error'); return; }
    hideForms();
    document.getElementById('questionForm').classList.add('active');
    updateCategories();
    if (isKeyboardActive) document.getElementById('arabicKeyboard').classList.add('active');
}
function hideForms() {
    var forms = document.querySelectorAll('.form-container');
    for (var i = 0; i < forms.length; i++) forms[i].classList.remove('active');
    var kb = document.getElementById('arabicKeyboard');
    if (kb) kb.classList.remove('active');
}
function goToAdmin() { window.location.href = '/admin'; }

function updateCategories() {
    var domain = document.getElementById('qDomain').value;
    var cats = categoriesByDomain[domain] || [];
    var select = document.getElementById('qCategory');
    select.innerHTML = '';
    for (var i = 0; i < cats.length; i++) {
        var opt = document.createElement('option');
        opt.value = cats[i];
        opt.textContent = cats[i];
        select.appendChild(opt);
    }
}

// ============================================================
// AUTHENTIFICATION
// ============================================================
function login() {
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;
    var user = null;
    for (var i = 0; i < users.length; i++) {
        if (users[i].email === email && users[i].password === password) { user = users[i]; break; }
    }
    if (user) {
        currentUser = user;
        if (user.language) currentLanguage = user.language;
        updateUI();
        hideForms();
        showNotification('✅ Connecté !', 'success');
        renderQuestions();
    } else {
        showNotification('❌ Identifiants incorrects', 'error');
    }
}

function register() {
    var username = document.getElementById('regUsername').value;
    var email = document.getElementById('regEmail').value;
    var password = document.getElementById('regPassword').value;
    var language = document.getElementById('regLanguage').value;
    var domain = document.getElementById('regDomain').value;
    if (!username || !email || !password) { showNotification('Veuillez remplir tous les champs', 'error'); return; }
    if (password.length < 6) { showNotification('Mot de passe : 6 caractères min', 'error'); return; }
    for (var i = 0; i < users.length; i++) {
        if (users[i].email === email) { showNotification('Email déjà utilisé', 'error'); return; }
    }
    var newUser = { id: users.length + 1, username: username, email: email, password: password, role: 'user', language: language, domain: domain };
    users.push(newUser);
    currentUser = newUser;
    currentLanguage = language;
    updateUI();
    hideForms();
    showNotification('✅ Inscription réussie !', 'success');
    renderQuestions();
}

function logout() {
    currentUser = null;
    updateUI();
    showNotification('Déconnecté', 'info');
}

function updateUI() {
    if (currentUser) {
        document.getElementById('authButtons').style.display = 'none';
        document.getElementById('userActions').style.display = 'flex';
        document.getElementById('userDisplay').innerHTML =
            '<span class="user-avatar">' + currentUser.username[0].toUpperCase() + '</span> ' +
            '<span>' + currentUser.username + '</span>';
        document.getElementById('newQuestionBtn').style.display = 'inline-block';
        document.getElementById('userRole').innerHTML = '👤 ' + currentUser.username;
        if (currentUser.role === 'admin') {
            document.getElementById('adminBtn').style.display = 'inline-block';
        }
    } else {
        document.getElementById('authButtons').style.display = 'flex';
        document.getElementById('userActions').style.display = 'none';
        document.getElementById('newQuestionBtn').style.display = 'none';
        document.getElementById('adminBtn').style.display = 'none';
        document.getElementById('userRole').innerHTML = '👤 Visiteur';
    }
    document.getElementById('langDisplay').innerHTML = '🌐 ' + getLangName(currentLanguage);
}

// ============================================================
// QUESTIONS
// ============================================================
function askQuestion() {
    if (!currentUser) { showNotification('Veuillez vous connecter', 'error'); return; }
    var domain = document.getElementById('qDomain').value;
    var category = document.getElementById('qCategory').value;
    var title = document.getElementById('qTitle').value;
    var content = document.getElementById('qContent').value;
    var language = document.getElementById('qLanguage').value;
    
    if (!title || !content) { showNotification('Titre et contenu obligatoires', 'error'); return; }
    
    var scholar = assignScholar(domain, category);
    
    questions.unshift({
        id: questions.length + 1,
        domain: domain,
        title: title,
        category: category,
        content: content,
        username: currentUser.username,
        language: language,
        date: new Date().toLocaleDateString(),
        status: scholar ? 'assigned' : 'pending',
        scholar: scholar,
        answers: []
    });
    
    var message = '✅ Question publiée !';
    if (scholar) message += ' Scholar assigné : ' + scholar.name;
    showNotification(message, 'success');
    hideForms();
    renderQuestions();
    document.getElementById('qTitle').value = '';
    document.getElementById('qContent').value = '';
}

function renderQuestions() {
    var container = document.getElementById('questionsContainer');
    var filtered = currentFilter === 'all' ? questions : questions.filter(function(q) { return q.domain === currentFilter; });
    
    document.getElementById('questionCount').textContent = '📋 ' + questions.length + ' questions';
    document.getElementById('scholarCount').textContent = '🎓 ' + scholarsData.length + ' Scholars';
    
    if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center;opacity:0.5;padding:40px;">Aucune question dans ce domaine. Posez la première !</p>';
        return;
    }
    
    var html = '';
    for (var i = 0; i < filtered.length; i++) {
        var q = filtered[i];
        var statusClass = q.status === 'assigned' ? 'badge-assigned' : q.status === 'answered' ? 'badge-answered' : 'badge-pending';
        var statusLabel = q.status === 'assigned' ? 'Assigné' : q.status === 'answered' ? 'Répondu' : 'En attente';
        var dClass = getDomainClass(q.domain);
        var icon = getDomainIcon(q.domain);
        
        var scholarInfo = '';
        if (q.scholar) {
            scholarInfo = '<span class="domain-tag ' + dClass + '">🎓 ' + q.scholar.name + '</span>';
        }
        
        var answersHtml = '';
        if (q.answers && q.answers.length > 0) {
            answersHtml = '<div class="answers-section"><strong>💬 ' + q.answers.length + ' réponses</strong>';
            for (var j = 0; j < q.answers.length; j++) {
                var a = q.answers[j];
                answersHtml += '<div class="answer-item">' +
                    '<div>' + a.content + '</div>' +
                    '<div class="answer-meta">👤 ' + a.username + ' | 🌐 ' + getLangName(a.language) +
                    (a.aiVerified ? ' | ✅ Vérifié par AI' : '') + '</div></div>';
            }
            answersHtml += '</div>';
        } else {
            answersHtml = '<div style="margin-top:10px;opacity:0.5;font-size:13px;">💬 Pas encore de réponse</div>';
        }
        
        var answerBtn = currentUser ? '<button class="btn btn-secondary" onclick="showAnswerForm(' + q.id + ')">💬 Répondre</button>' : '';
        
        html += '<div class="question-card">' +
            '<div class="question-title">' + icon + ' ' + q.title + '</div>' +
            '<div class="question-meta">' +
            '<span class="domain-tag ' + dClass + '">' + q.domain + '</span>' +
            ' 👤 ' + q.username + ' | 📂 ' + q.category + ' | 🌐 ' + getLangName(q.language) + ' | 📅 ' + q.date +
            ' | <span class="badge ' + statusClass + '">' + statusLabel + '</span> ' + scholarInfo +
            '</div>' +
            '<div class="question-content">' + q.content + '</div>' +
            '<div class="question-actions">' + answerBtn + '</div>' +
            answersHtml +
            '</div>';
    }
    container.innerHTML = html;
}

function showAnswerForm(questionId) {
    if (!currentUser) { showNotification('Veuillez vous connecter', 'error'); return; }
    var content = prompt('Votre réponse :');
    if (!content) return;
    var lang = prompt('Langue (fr/ar/en/es/de/it/pt) :', currentLanguage) || currentLanguage;
    for (var i = 0; i < questions.length; i++) {
        if (questions[i].id === questionId) {
            if (!questions[i].answers) questions[i].answers = [];
            var isScholar = scholarsData.some(function(s) { return s.name === currentUser.username; });
            questions[i].answers.push({
                username: currentUser.username,
                content: content,
                language: lang,
                aiVerified: isScholar
            });
            if (isScholar) questions[i].status = 'answered';
            showNotification('✅ Réponse publiée !', 'success');
            renderQuestions();
            break;
        }
    }
}

function loadData() {
    renderQuestions();
    showNotification('Données actualisées', 'info');
}

// INIT
renderQuestions();
updateUI();
