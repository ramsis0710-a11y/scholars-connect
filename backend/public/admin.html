<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Segoe UI",sans-serif; background:#0a0e27; color:#fff; padding:20px; }
.container { max-width:1400px; margin:0 auto; }
.header { display:flex; justify-content:space-between; align-items:center; padding:20px 0; border-bottom:2px solid #22c55e; flex-wrap:wrap; gap:10px; }
.logo { font-size:28px; font-weight:700; color:#22c55e; }
.btn { padding:10px 20px; border:none; border-radius:10px; cursor:pointer; font-weight:600; margin:5px; }
.btn-secondary { background:rgba(255,255,255,0.1); color:white; }
.btn-primary { background:#667eea; color:white; }
.btn-claude { background:linear-gradient(135deg,#8b5cf6,#ec4899); color:white; }
.btn-mongo { background:#22c55e; color:white; }
table { width:100%; border-collapse:collapse; margin-top:20px; font-size:12px; }
th,td { padding:8px 10px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.05); }
th { color:#22c55e; font-size:11px; text-transform:uppercase; }
.badge { padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; background:#667eea; color:white; }
.badge-claude { background:linear-gradient(135deg,#8b5cf6,#ec4899); color:white; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:15px; margin:20px 0; }
.stat-card { background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; text-align:center; border:1px solid rgba(34,197,94,0.2); }
.stat-number { font-size:28px; font-weight:700; color:#22c55e; }
.stat-label { opacity:0.7; margin-top:5px; font-size:11px; }
.mongo-status { display:inline-block; padding:5px 15px; border-radius:20px; background:#22c55e; color:white; font-weight:600; font-size:12px; }
</style>
</head>
<body>

</div>

async function loadData() {
    try {
        health = await (await fetch(API_URL + '/health')).json();
        users = await (await fetch(API_URL + '/users')).json();
        questions = await (await fetch(API_URL + '/questions')).json();
        history = await (await fetch(API_URL + '/history')).json();
        
        var mongoEl = document.getElementById('mongoStatus');
        if (health.mongodb === 'connected') {
            mongoEl.textContent = '🍃 MongoDB Connecté';
            mongoEl.style.background = '#22c55e';
        } else {
            mongoEl.textContent = '❌ MongoDB Déconnecté';
            mongoEl.style.background = '#ef4444';
        }
        updateStats();
    } catch(e) { console.error(e); }
}

function updateStats() {
    var totalAnswers = 0, claudeAnswers = 0;
    questions.forEach(function(q) {
        if (q.answers) q.answers.forEach(function(a) { totalAnswers++; if (a.isClaude) claudeAnswers++; });
    });
    document.getElementById('statsContainer').innerHTML =
        '<div class="stat-card"><div class="stat-number">' + scholars.length + '</div><div class="stat-label">🎓 Scholars</div></div>' +
        '<div class="stat-card"><div class="stat-number">17</div><div class="stat-label">🌍 Domaines</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + users.length + '</div><div class="stat-label">👤 Utilisateurs</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + questions.length + '</div><div class="stat-label">📋 Questions</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + totalAnswers + '</div><div class="stat-label">💬 Réponses</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + claudeAnswers + '</div><div class="stat-label">🤖 Claude</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + history.length + '</div><div class="stat-label">📜 Actions</div></div>';
}

function showTab(tab) {
    var c = document.getElementById('content');
    if (tab === 'scholars') {
        var h = '<h3>🎓 Scholars (' + scholars.length + ')</h3><table><thead><tr><th>Nom</th><th>Domaine</th><th>Expertise</th><th>Note</th></tr></thead><tbody>';
        scholars.forEach(function(s) {
            h += '<tr><td>' + s.name + '</td><td><span class="badge">' + s.domain + '</span></td><td>' + s.expertise + '</td><td>⭐ ' + s.rating + '</td></tr>';
        });
        h += '</tbody></table>';
        c.innerHTML = h;
    } else if (tab === 'questions') {
        if (questions.length === 0) { c.innerHTML = '<p style="text-align:center;padding:30px;opacity:0.5;">Aucune question.</p>'; return; }
        var h = '<h3>📋 Questions (' + questions.length + ')</h3><table><thead><tr><th>Titre</th><th>Domaine</th><th>Auteur</th><th>Scholar</th><th>Statut</th><th>Réponses</th><th>Date</th></tr></thead><tbody>';
        questions.forEach(function(q) {
            var sn = q.scholar ? q.scholar.name : 'Non assigné';
            var ac = q.answers ? q.answers.length : 0;
            h += '<tr><td>' + q.title + '</td><td><span class="badge">' + q.domain + '</span></td><td>' + q.username + '</td><td>' + sn + '</td><td>' + q.status + '</td><td>' + ac + '</td><td>' + (q.date || '') + '</td></tr>';
        });
        h += '</tbody></table>';
        c.innerHTML = h;
    } else if (tab === 'claude') {
        var list = [];
        questions.forEach(function(q) { if (q.answers) q.answers.forEach(function(a) { if (a.isClaude) list.push({ q: q, a: a }); }); });
        var h = '<h3>🤖 Réponses Claude (' + list.length + ')</h3>';
        if (list.length === 0) h += '<p style="text-align:center;padding:30px;opacity:0.5;">Aucune réponse Claude.</p>';
        else list.forEach(function(item) {
            var r = item.a.claudeReason === 'no_literature' ? '❌ Sans littérature' : '⏱️ Timeout 5 min';
            h += '<div style="background:linear-gradient(135deg,rgba(139,92,246,0.1),rgba(236,72,153,0.05));padding:15px;border-radius:10px;margin:10px 0;border-left:4px solid #8b5cf6;"><strong>' + item.q.title + '</strong> <span class="badge badge-claude">' + r + '</span><div style="margin-top:10px;white-space:pre-wrap;font-size:12px;">' + item.a.content + '</div></div>';
        });
        c.innerHTML = h;
    } else if (tab === 'users') {
        var h = '<h3>👤 Utilisateurs (' + users.length + ')</h3><table><thead><tr><th>ID</th><th>Nom</th><th>Email</th><th>Rôle</th><th>Inscrit</th></tr></thead><tbody>';
        users.forEach(function(u) {
            h += '<tr><td>' + (u._id || u.id) + '</td><td>' + u.username + '</td><td>' + u.email + '</td><td>' + u.role + '</td><td>' + (u.createdAt ? new Date(u.createdAt).toLocaleString('fr-FR') : '-') + '</td></tr>';
        });
        h += '</tbody></table>';
        c.innerHTML = h;
    } else if (tab === 'history') {
        var h = '<h3>📜 Historique complet (' + history.length + ')</h3>';
        if (history.length === 0) h += '<p style="text-align:center;padding:30px;opacity:0.5;">Aucune action.</p>';
        else {
            h += '<table><thead><tr><th>Utilisateur</th><th>Action</th><th>Détails</th><th>Date</th></tr></thead><tbody>';
            history.slice(0, 200).forEach(function(e) {
                h += '<tr><td>' + e.username + '</td><td>' + e.action + '</td><td>' + JSON.stringify(e.data).substring(0, 50) + '</td><td>' + (e.date || '') + '</td></tr>';
            });
            h += '</tbody></table>';
        }
        c.innerHTML = h;
    }
}

loadData().then(function() { showTab('scholars'); });

</html>
