<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شولارز كونكت - لوحة التحكم</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Segoe UI","Traditional Arabic",sans-serif; background:#0a0e27; color:#fff; padding:20px; }
.container { max-width:1000px; margin:0 auto; }
.header { display:flex; justify-content:space-between; align-items:center; padding:20px 0; border-bottom:2px solid #059669; flex-wrap:wrap; gap:10px; }
.logo { font-size:28px; font-weight:700; color:#059669; }
.btn { padding:10px 20px; border:none; border-radius:10px; cursor:pointer; font-weight:600; }
.btn-secondary { background:rgba(255,255,255,0.1); color:white; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th,td { padding:12px; text-align:right; border-bottom:1px solid rgba(255,255,255,0.05); }
th { color:#059669; }
.badge { padding:2px 12px; border-radius:20px; font-size:12px; }
.badge-admin { background:#f59e0b; color:#0a0e27; }
.badge-user { background:#3b82f6; color:white; }
.badge-scholar { background:#8b5cf6; color:white; }
.badge-islam { background:#059669; color:white; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:20px; margin:20px 0; }
.stat-card { background:rgba(255,255,255,0.05); padding:20px; border-radius:12px; text-align:center; }
.stat-number { font-size:32px; font-weight:700; color:#059669; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div><span class="logo">🕌 شولارز كونكت</span></div>
        <div><button class="btn btn-secondary" onclick="window.location.href='/'">🏠 العودة</button></div>
    </div>
    <div class="stats">
        <div class="stat-card"><div class="stat-number">1</div><div class="stat-label">👤 المستخدمين</div></div>
        <div class="stat-card"><div class="stat-number">6</div><div class="stat-label">🕌 علماء الإسلام</div></div>
        <div class="stat-card"><div class="stat-number">3</div><div class="stat-label">📚 علماء عام</div></div>
        <div class="stat-card"><div class="stat-number">0</div><div class="stat-label">📋 الأسئلة</div></div>
    </div>
    <div id="content"></div>
</div>
<script>
document.getElementById('content').innerHTML =
    '<h3>👤 المستخدمين</h3>' +
    '<table><thead><tr><th>المعرف</th><th>الاسم</th><th>البريد الإلكتروني</th><th>الدور</th><th>الديانة</th></tr></thead><tbody>' +
    '<tr><td>1</td><td>مدير النظام</td><td>admin@scholars-connect.com</td><td><span class="badge badge-admin">مدير</span></td><td>🕌 إسلام</td></tr>' +
    '</tbody></table>' +
    '<h3 style="margin-top:20px;">🕌 علماء الإسلام (6)</h3>' +
    '<table><thead><tr><th>الاسم</th><th>التخصص</th><th>اللغات</th><th>التقييم</th></tr></thead><tbody>' +
    '<tr><td>د. أحمد الفقيه</td><td>الفقه</td><td>العربية, Français, English</td><td>⭐ 4.9</td></tr>' +
    '<tr><td>د. فاطمة العقيدة</td><td>العقيدة</td><td>العربية, Français, English</td><td>⭐ 4.8</td></tr>' +
    '<tr><td>د. عمر الحديث</td><td>الحديث</td><td>العربية, English, Français</td><td>⭐ 4.9</td></tr>' +
    '<tr><td>د. ليلى التفسير</td><td>التفسير</td><td>العربية, Français, English</td><td>⭐ 4.7</td></tr>' +
    '<tr><td>د. يوسف السيرة</td><td>السيرة</td><td>العربية, English, Français</td><td>⭐ 4.6</td></tr>' +
    '<tr><td>د. خديجة التصوف</td><td>التصوف</td><td>العربية, Français, English</td><td>⭐ 4.5</td></tr>' +
    '</tbody></table>' +
    '<h3 style="margin-top:20px;">📚 علماء عام (3)</h3>' +
    '<table><thead><tr><th>الاسم</th><th>التخصص</th><th>اللغات</th><th>التقييم</th></tr></thead><tbody>' +
    '<tr><td>د. أميرة الرياضيات</td><td>الرياضيات</td><td>العربية, Français, English</td><td>⭐ 4.9</td></tr>' +
    '<tr><td>د. صوفي الفيزياء</td><td>الفيزياء</td><td>العربية, Français, English</td><td>⭐ 4.8</td></tr>' +
    '<tr><td>د. كريم المعلوماتية</td><td>المعلوماتية</td><td>العربية, Français, English, Español</td><td>⭐ 4.7</td></tr>' +
    '</tbody></table>';
</script>
</body>
</html>
