<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Scholars Connect - Admin</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Segoe UI",sans-serif; background:#0a0e27; color:#fff; padding:20px; }
.container { max-width:1400px; margin:0 auto; }
.header { display:flex; justify-content:space-between; align-items:center; padding:20px 0; border-bottom:2px solid #8b5cf6; flex-wrap:wrap; gap:10px; }
.logo { font-size:28px; font-weight:700; color:#8b5cf6; }
.btn { padding:10px 20px; border:none; border-radius:10px; cursor:pointer; font-weight:600; margin:5px; }
.btn-secondary { background:rgba(255,255,255,0.1); color:white; }
.btn-primary { background:#667eea; color:white; }
.btn-claude { background:linear-gradient(135deg,#8b5cf6,#ec4899); color:white; }
.btn-mongo { background:#22c55e; color:white; }
.btn-danger { background:#ef4444; color:white; }
table { width:100%; border-collapse:collapse; margin-top:20px; font-size:12px; }
th,td { padding:8px 10px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.05); }
th { color:#8b5cf6; font-size:11px; text-transform:uppercase; }
.badge { padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; background:#667eea; color:white; }
.badge-claude { background:linear-gradient(135deg,#8b5cf6,#ec4899); color:white; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:15px; margin:20px 0; }
.stat-card { background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; text-align:center; border:1px solid rgba(139,92,246,0.2); }
.stat-number { font-size:28px; font-weight:700; color:#8b5cf6; }
.stat-label { opacity:0.7; margin-top:5px; font-size:11px; }
.mongo-status { display:inline-block; padding:5px 15px; border-radius:20px; background:#22c55e; color:white; font-weight:600; font-size:12px; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<div><span class="logo">⚙️ Admin</span> <span class="mongo-status" id="status">🍃 MongoDB + 🤖 Gemini</span></div>
<div>
<button class="btn btn-secondary" onclick="window.location.href='/'">🏠 Accueil</button>
<button class="btn btn-danger" onclick="logoutAdmin()">🚪 Déconnexion</button>
</div>
</div>
<div class="stats" id="statsContainer"></div>
<div style="margin:15px 0;">
<button class="btn btn-primary" onclick="showTab('scholars')">🎓 Scholars</button>
<button class="btn btn-primary" onclick="showTab('questions')">📋 Questions</button>
<button class="btn btn-claude" onclick="showTab('claude')">🤖 Claude</button>
<button class="btn btn-primary" onclick="showTab('users')">👤 Users</button>
<button class="btn btn-mongo" onclick="showTab('history')">📜 Historique</button>
</div>
<div id="content"></div>
</div>
<script>
var API_URL = window.location.origin + '/api';
var users = [], questions = [], history = [], health = {};

// Vérifier la session admin
var adminSession = null;
try { adminSession = JSON.parse(localStorage.getItem('sc_admin_session')); } catch(e) {}
if (!adminSession || adminSession.role !== 'admin') {
    window.location.href = '/admin-login';
}

async function loadData() {
    try {
        health = await (await fetch(API_URL + '/health')).json();
        users = await (await fetch(API_URL + '/users')).json();
        questions = await (await fetch(API_URL + '/questions')).json();
        history = await (await fetch(API_URL + '/history')).json();
        document.getElementById('status').textContent = '🍃 ' + health.mongodb + ' · 🤖 ' + health.gemini;
        document.getElementById('status').style.background = health.mongodb === 'connected' ? '#22c55e' : '#ef4444';
        updateStats();
    } catch(e) { console.error(e); }
}

function updateStats() {
    var totalAnswers = 0, claudeAnswers = 0;
    questions.forEach(function(q) { if (q.answers) q.answers.forEach(function(a) { totalAnswers++; if (a.isClaude) claudeAnswers++; }); });
    document.getElementById('statsContainer').innerHTML =
        '<div class="stat-card"><div class="stat-number">17</div><div class="stat-label">🌍 Domaines</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + users.length + '</div><div class="stat-label">👤 Utilisateurs</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + questions.length + '</div><div class="stat-label">📋 Questions</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + totalAnswers + '</div><div class="stat-label">💬 Réponses</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + claudeAnswers + '</div><div class="stat-label">🤖 Claude</div></div>';
}

function showTab(tab) {
    var c = document.getElementById('content');
    if (tab === 'scholars') {
        var domains = ['Islam','Médecine','Pharmacie','Chimie','IA','IoT','GMAO','Mécanique Pétrole','Gestion','Expertise Comptable','Droit','Économie','Culture Générale','Art','Architecture','Restauration','Général'];
        var h = '<h3>🎓 Scholars par domaine</h3><table><thead><tr><th>Domaine</th><th>Nombre</th></tr></thead><tbody>';
        domains.forEach(function(d) { h += '<tr><td>' + d + '</td><td>~4</td></tr>'; });
        h += '</tbody></table>';
        c.innerHTML = h;
    } else if (tab === 'questions') {
        if (questions.length === 0) { c.innerHTML = '<p style="text-align:center;padding:30px;opacity:0.5;">Aucune question.</p>'; return; }
        var h = '<h3>📋 Questions (' + questions.length + ')</h3><table><thead><tr><th>Titre</th><th>Domaine</th><th>Langue</th><th>Auteur</th><th>Statut</th></tr></thead><tbody>';
        questions.forEach(function(q) { h += '<tr><td>' + q.title + '</td><td><span class="badge">' + q.domain + '</span></td><td>' + (q.language || 'fr') + '</td><td>' + q.username + '</td><td>' + q.status + '</td></tr>'; });
        h += '</tbody></table>';
        c.innerHTML = h;
    } else if (tab === 'claude') {
        var list = [];
        questions.forEach(function(q) { if (q.answers) q.answers.forEach(function(a) { if (a.isClaude) list.push({ q: q, a: a }); }); });
        var h = '<h3>🤖 Réponses Claude (' + list.length + ')</h3>';
        if (list.length === 0) h += '<p style="text-align:center;padding:30px;opacity:0.5;">Aucune.</p>';
        else list.forEach(function(item) {
            h += '<div style="background:linear-gradient(135deg,rgba(139,92,246,0.1),rgba(236,72,153,0.05));padding:15px;border-radius:10px;margin:10px 0;border-left:4px solid #8b5cf6;"><strong>' + item.q.title + '</strong><div style="margin-top:10px;white-space:pre-wrap;font-size:12px;">' + item.a.content + '</div></div>';
        });
        c.innerHTML = h;
    } else if (tab === 'users') {
        var h = '<h3>👤 Utilisateurs (' + users.length + ')</h3><table><thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Langue</th></tr></thead><tbody>';
        users.forEach(function(u) { h += '<tr><td>' + u.username + '</td><td>' + u.email + '</td><td>' + u.role + '</td><td>' + (u.language || 'fr') + '</td></tr>'; });
        h += '</tbody></table>';
        c.innerHTML = h;
    } else if (tab === 'history') {
        var h = '<h3>📜 Historique (' + history.length + ')</h3>';
        if (history.length === 0) h += '<p style="text-align:center;padding:30px;opacity:0.5;">Aucune.</p>';
        else {
            h += '<table><thead><tr><th>Utilisateur</th><th>Action</th><th>Date</th></tr></thead><tbody>';
            history.slice(0, 200).forEach(function(e) { h += '<tr><td>' + e.username + '</td><td>' + e.action + '</td><td>' + (e.date || '') + '</td></tr>'; });
            h += '</tbody></table>';
        }
        c.innerHTML = h;
    }
}

function logoutAdmin() {
    localStorage.removeItem('sc_admin_session');
    window.location.href = '/admin-login';
}

loadData().then(function() { showTab('scholars'); });
</script>
</body>
</html>
