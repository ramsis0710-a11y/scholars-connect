<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | Scholars Connect</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a2540; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; color: #17202a; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h1 { color: #0a2540; font-size: 24px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; font-weight: 600; color: #374151; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-admin { background: #fef3c7; color: #b45309; }
        .badge-user { background: #e0f2fe; color: #0369a1; }
        .badge-active { background: #dcfce7; color: #166534; }
        .badge-blocked { background: #fee2e2; color: #991b1b; }
        .btn { padding: 6px 12px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 4px; font-size: 12px; }
        .btn-block { background: #f59e0b; color: #fff; }
        .btn-unblock { background: #10b981; color: #fff; }
        .btn-delete { background: #ef4444; color: #fff; }
        .btn-logout { background: #6b7280; color: #fff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; }
        .btn-chat { background: #0a2540; color: #fff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            ⚙️ Gestion des Utilisateurs
            <div>
                <a href="/chat" class="btn-chat">💬 Aller au Chat</a>
                <a href="#" class="btn-logout" onclick="logout()">Déconnexion</a>
            </div>
        </h1>
        
        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th>Statut</th>
                    <th>Date d'inscription</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTable">
                <tr><td colspan="6" style="text-align:center;">Chargement...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = 'https://scholars-connect-app.onrender.com';
        const token = localStorage.getItem('token');

        if (!token || localStorage.getItem('role') !== 'admin') {
            window.location.href = '/login';
        }

        async function loadUsers() {
            try {
                const resp = await fetch(API_BASE + '/api/admin/users', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (resp.status === 403) {
                    alert('Accès refusé.');
                    window.location.href = '/login';
                    return;
                }
                const data = await resp.json();
                const tbody = document.getElementById('usersTable');
                tbody.innerHTML = '';

                if (!data.users || data.users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Aucun utilisateur.</td></tr>';
                    return;
                }

                data.users.forEach(u => {
                    const tr = document.createElement('tr');
                    const isAdmin = u.role === 'admin';
                    const isActive = u.status === 'active';
                    const date = new Date(u.createdAt).toLocaleDateString();

                    tr.innerHTML = `
                        <td>${u.name || '-'}</td>
                        <td>${u.email}</td>
                        <td><span class="badge ${isAdmin ? 'badge-admin' : 'badge-user'}">${isAdmin ? 'Admin' : 'Utilisateur'}</span></td>
                        <td><span class="badge ${isActive ? 'badge-active' : 'badge-blocked'}">${isActive ? 'Actif' : 'Bloqué'}</span></td>
                        <td>${date}</td>
                        <td>
                            ${!isAdmin ? `
                                <button class="btn ${isActive ? 'btn-block' : 'btn-unblock'}" onclick="toggleStatus('${u._id}', '${isActive ? 'blocked' : 'active'}')">
                                    ${isActive ? 'Bloquer' : 'Débloquer'}
                                </button>
                                <button class="btn btn-delete" onclick="deleteUser('${u._id}')">Supprimer</button>
                            ` : '<span style="color:#9ca3af;font-size:12px;">Protégé</span>'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                document.getElementById('usersTable').innerHTML = `<tr><td colspan="6" style="color:red;">Erreur : ${e.message}</td></tr>`;
            }
        }

        async function toggleStatus(id, newStatus) {
            if (!confirm(`Voulez-vous vraiment ${newStatus === 'blocked' ? 'bloquer' : 'débloquer'} cet utilisateur ?`)) return;
            try {
                const resp = await fetch(API_BASE + '/api/admin/users/' + id + '/status', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (resp.ok) loadUsers();
                else alert('Erreur lors de la modification.');
            } catch (e) { alert(e.message); }
        }

        async function deleteUser(id) {
            if (!confirm('Voulez-vous vraiment SUPPRIMER cet utilisateur ? Cette action est irréversible.')) return;
            try {
                const resp = await fetch(API_BASE + '/api/admin/users/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (resp.ok) loadUsers();
                else alert('Erreur lors de la suppression.');
            } catch (e) { alert(e.message); }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = '/login';
        }

        loadUsers();
    </script>
</body>
</html>
