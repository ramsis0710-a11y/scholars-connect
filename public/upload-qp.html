<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMPI - Générateur de Plans Qualité</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f5f7fa; padding: 20px; color: #17202a; }
  .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
  h1 { color: #0a2540; font-size: 22px; margin-bottom: 6px; }
  .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
  .section { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  .section h2 { font-size: 15px; color: #0a2540; margin-bottom: 12px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input[type="email"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  input[type="file"] { display: block; width: 100%; padding: 10px; border: 2px dashed #cbd5e1; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; margin-bottom: 8px; }
  input[type="file"]:hover { border-color: #1e5aa8; background: #f0f7ff; }
  button { background: #0a2540; color: #fff; border: 0; padding: 14px 28px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
  button:hover { background: #1e5aa8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: #16a34a; }
  .btn-secondary:hover { background: #15803d; }
  .result { margin-top: 20px; padding: 16px; border-radius: 10px; font-size: 13px; line-height: 1.6; display: none; }
  .result.ok { background: #dcfce7; border-left: 4px solid #16a34a; color: #14532d; }
  .result.ko { background: #fee2e2; border-left: 4px solid #dc2626; color: #7f1d1d; }
  .result a { background: #0a2540; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 6px; display: inline-block; margin: 6px 6px 0 0; font-weight: 700; }
  .result a:hover { background: #1e5aa8; }
  .status { font-size: 12px; color: #6b7280; margin-top: 8px; }
  .divider { text-align: center; color: #9ca3af; font-size: 12px; margin: 16px 0; font-weight: 600; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <h1>📋 Générateur de Plans Qualité</h1>
  <p class="subtitle">GMPI - QP STANDARD 01 (FO-24-PRO Rev 6) — Générez vos plans qualité depuis un fichier PDF, Excel ou texte</p>

  <div class="section" id="authSection">
    <h2>1. Connexion</h2>
    <label>Email</label>
    <input type="email" id="email" placeholder="votre@email.com" value="t_demo@test.tn">
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="Test123!" value="Test123!">
    <button id="btnLogin" type="button">Se connecter / Créer un compte</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div class="section hidden" id="uploadSection">
    <h2>2. Choisir votre document</h2>
    <div style="margin-bottom: 16px;">
      <label>📄 Fichier PDF (ARC scanné ou numérique)</label>
      <input type="file" id="filePdf" accept=".pdf,application/pdf">
    </div>
    <div class="divider">— OU —</div>
    <div style="margin-bottom: 16px;">
      <label>📊 Fichier Excel / CSV / TSV (liste de WO)</label>
      <input type="file" id="fileExcel" accept=".csv,.tsv,.txt,.tab">
    </div>
    <div class="divider">— OU —</div>
    <div>
      <label>📝 Fichier texte (ARC en texte brut)</label>
      <input type="file" id="fileText" accept=".txt,.log,text/plain">
    </div>
  </div>

  <div class="section hidden" id="actionSection">
    <button id="btnGenerate" class="btn-secondary" type="button" disabled>🎯 Envoyer et générer le QP</button>
    <div class="status" id="genStatus">Choisissez d'abord un fichier ci-dessus</div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
(function() {
  var API_BASE = 'https://scholars-connect-app.onrender.com';
  var token = '';

  var $ = function(id) { return document.getElementById(id); };

  // Login / Register
  $('btnLogin').addEventListener('click', async function() {
    var email = $('email').value.trim();
    var password = $('password').value;
    if (!email || !password) { showLoginStatus('Email et mot de passe requis', false); return; }

    $('btnLogin').disabled = true;
    showLoginStatus('Connexion en cours...', null);

    try {
      // Essayer inscription
      var resp = await fetch(API_BASE + '/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, name: email })
      });

      if (!resp.ok) {
        // Si existe deja, se connecter
        resp = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });
      }

      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      var data = await resp.json();
      token = data.token;
      if (!token) throw new Error('Token manquant');

      showLoginStatus('✓ Connecté (' + email + ')', true);
      $('authSection').classList.add('hidden');
      $('uploadSection').classList.remove('hidden');
      $('actionSection').classList.remove('hidden');
      $('btnLogin').disabled = false;
    } catch (e) {
      showLoginStatus('✗ ' + e.message, false);
      $('btnLogin').disabled = false;
    }
  });

  function showLoginStatus(msg, ok) {
    var el = $('loginStatus');
    el.textContent = msg;
    el.style.color = ok === true ? '#16a34a' : (ok === false ? '#dc2626' : '#6b7280');
  }

  // Detection fichier choisi
  ['filePdf', 'fileExcel', 'fileText'].forEach(function(id) {
    $(id).addEventListener('change', function() {
      var hasFile = !!($('filePdf').files[0] || $('fileExcel').files[0] || $('fileText').files[0]);
      $('btnGenerate').disabled = !hasFile;
      if (hasFile) {
        var name = ($('filePdf').files[0] || $('fileExcel').files[0] || $('fileText').files[0]).name;
        $('genStatus').textContent = 'Prêt à envoyer : ' + name;
        $('genStatus').style.color = '#16a34a';
      }
    });
  });

  // Generation
  $('btnGenerate').addEventListener('click', async function() {
    $('btnGenerate').disabled = true;
    $('result').className = 'result';
    $('result').style.display = 'none';

    try {
      var filePdf = $('filePdf').files[0];
      var fileExcel = $('fileExcel').files[0];
      var fileText = $('fileText').files[0];

      var endpoint, contentType, body;

      if (filePdf) {
        $('genStatus').textContent = 'Envoi du PDF...';
        var pdfBuf = await filePdf.arrayBuffer();
        endpoint = '/api/qp-generate-pdf';
        contentType = 'application/pdf';
        body = pdfBuf;
      } else if (fileExcel) {
        $('genStatus').textContent = 'Lecture du fichier Excel...';
        var excelText = await fileExcel.text();
        endpoint = '/api/qp-generate-excel';
        contentType = 'text/plain; charset=utf-8';
        body = excelText;
      } else if (fileText) {
        $('genStatus').textContent = 'Lecture du fichier texte...';
        var txt = await fileText.text();
        endpoint = '/api/qp-generate';
        contentType = 'text/plain; charset=utf-8';
        body = txt;
      } else {
        throw new Error('Aucun fichier sélectionné');
      }

      $('genStatus').textContent = 'Génération des QP en cours (peut prendre 30 secondes)...';

      var resp = await fetch(API_BASE + endpoint, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': contentType
        },
        body: body
      });

      var data = await resp.json();

      if (!resp.ok || !data.ok) {
        throw new Error(data.error || ('HTTP ' + resp.status));
      }

      // Succes
      var html = '<div style="font-weight:700;font-size:15px;margin-bottom:8px">✓ ' + data.wo + ' Work Order(s) → ' + data.qpDocs + ' QP générés</div>';
      if (data.customer) html += '<div><strong>Client :</strong> ' + data.customer + '</div>';
      if (data.po) html += '<div><strong>PO :</strong> ' + data.po + '</div>';
      if (data.avgConfidence !== undefined) html += '<div><strong>Confiance moyenne :</strong> ' + data.avgConfidence + '%</div>';
      if (data.links && data.links.length) {
        html += '<div style="margin-top:14px;font-weight:700;color:#0a2540">📥 Télécharger les PDF :</div>';
        data.links.forEach(function(l) {
          html += '<a href="' + API_BASE + l.url + '" target="_blank">📄 QP ' + l.from + ' à ' + l.to + '</a>';
        });
      }
      if (data.ids && data.ids.length) {
        html += '<div style="margin-top:10px;font-size:12px;color:#6b7280">WO : ' + data.ids.join(', ') + '</div>';
      }

      $('result').innerHTML = html;
      $('result').className = 'result ok';
      $('result').style.display = 'block';
      $('genStatus').textContent = '✓ Génération terminée';
      $('genStatus').style.color = '#16a34a';

    } catch (e) {
      $('result').innerHTML = '<strong>✗ Erreur :</strong> ' + e.message;
      $('result').className = 'result ko';
      $('result').style.display = 'block';
      $('genStatus').textContent = '✗ Échec';
      $('genStatus').style.color = '#dc2626';
    }

    $('btnGenerate').disabled = false;
  });
})();
</script>
</body>
</html>
