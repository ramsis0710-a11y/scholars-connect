<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Scholars Connect</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a2540; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; color: #17202a; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        h1 { color: #0a2540; font-size: 24px; margin-bottom: 8px; text-align: center; }
        p.sub { color: #6b7280; text-align: center; margin-bottom: 24px; font-size: 14px; }
        label { display: block; font-weight: 600; font-size: 13px; margin: 16px 0 6px; color: #374151; }
        input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #0a2540; color: #fff; border: 0; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 24px; transition: 0.2s; }
        button:hover { background: #1e5aa8; }
        button:disabled { opacity: 0.5; cursor: wait; }
        .error { color: #dc2626; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
        .success { color: #16a34a; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
        .link { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280; }
        .link a { color: #1e5aa8; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Créer un compte</h1>
        <p class="sub">Rejoignez Scholars Connect et accédez à l'audit sémantique V390.</p>
        
        <label for="name">Nom complet</label>
        <input type="text" id="name" placeholder="Votre nom" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="votre@email.com" required>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <button id="btnRegister" type="button">S'inscrire</button>
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <div class="link">Déjà un compte ? <a href="/login">Connectez-vous</a></div>
    </div>

    <script>
        const API_BASE = 'https://scholars-connect-app.onrender.com';
        
        document.getElementById('btnRegister').addEventListener('click', async () => {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnRegister');
            const errEl = document.getElementById('error');
            const succEl = document.getElementById('success');

            errEl.style.display = 'none';
            succEl.style.display = 'none';

            if (!name || !email || !password) {
                errEl.textContent = 'Veuillez remplir tous les champs.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Inscription en cours...';

            try {
                const resp = await fetch(API_BASE + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await resp.json();

                if (!resp.ok) {
                    throw new Error(data.error || 'Erreur lors de l\'inscription');
                }

                if (data.token) {
                    localStorage.setItem('token', data.token);
                    succEl.textContent = 'Compte créé avec succès ! Redirection...';
                    succEl.style.display = 'block';
                    setTimeout(() => { window.location.href = '/chat'; }, 1200);
                } else {
                    throw new Error('Token manquant dans la réponse.');
                }
            } catch (e) {
                errEl.textContent = e.message;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'S\'inscrire';
            }
        });
    </script>
</body>
</html>
