<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat - Scholars Connect</title><link rel="stylesheet" href="/style.css">
<style>
.chat-wrap{max-width:1000px;margin:0 auto;padding:20px}
.chat-card{background:white;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.15);display:flex;flex-direction:column;height:calc(100vh - 160px);overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:80%;padding:12px 16px;border-radius:14px;line-height:1.55;font-size:.95rem;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#0a2540,#1e5aa8);color:white}
.msg.bot{align-self:flex-start;background:#f5f7fa;color:#17202a}
.msg .meta{font-size:.75rem;color:#6b7280;margin-top:6px}
.msg.user .meta{color:rgba(255,255,255,.7)}
.msg-actions{display:flex;gap:8px;margin-top:8px;font-size:.8rem}
.msg-actions button{background:white;border:1px solid #e5e7eb;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;color:#0a2540}
.input-area{padding:16px;background:#f9fafb;border-top:1px solid #e5e7eb;display:flex;flex-direction:column;gap:10px}
.row-input{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;padding:12px;border:2px solid #e5e7eb;border-radius:12px;font-family:inherit;font-size:1rem;resize:none;min-height:52px;max-height:150px;outline:none}
textarea:focus{border-color:#1e5aa8}
.btn-group{display:flex;gap:8px}
.btn-mic{background:#dc2626;color:white;border:none;padding:14px;border-radius:12px;cursor:pointer;font-size:1.1rem;width:52px}
.btn-mic.active{background:#16a34a;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.options-bar{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem}
.options-bar select{padding:6px 10px;border-radius:8px;border:1px solid #e5e7eb;font-size:.85rem}
.options-bar label{display:flex;align-items:center;gap:5px;color:#374151}
.scholar-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.scholar-chip{background:#f5f7fa;border:1px solid #e5e7eb;padding:4px 10px;border-radius:14px;font-size:.8rem;cursor:pointer}
.scholar-chip:hover{background:#1e5aa8;color:white;border-color:#1e5aa8}
.scholar-chip.selected{background:#1e5aa8;color:white}
.dict-badge{display:none;background:#fef3c7;border:2px solid #f59e0b;padding:8px 14px;border-radius:10px;font-size:.85rem;color:#92400e;margin-bottom:8px}
.dict-badge.active{display:block}
.confirm-btn{background:#16a34a;color:white;border:none;padding:10px 20px;border-radius:10px;font-weight:600;cursor:pointer;display:none;margin-top:8px}
.confirm-btn.active{display:inline-block}
</style></head><body>
<div class="header">
  <div class="logo"><div class="mark">SC</div><div><h1>Scholars Connect</h1><p>Assistant IA</p></div></div>
  <div class="nav" id="nav-user"></div>
</div>
<div class="chat-wrap">
  <div class="chat-card">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="dict-badge" id="dict-status">Dictee en cours... Parlez puis faites une pause de 10 secondes.</div>
      <div class="options-bar">
        <label>Langue : <select id="lang"><option value="fr">Francais</option><option value="en">English</option><option value="ar">Ø§Ù„Ø¹Ø±Ø¨ÙŠØ©</option><option value="es">Espanol</option></select></label>
        <label>Domaine : <select id="domain"><option>General</option><option>Religion</option><option>Education</option><option>Technique</option><option>Analyse</option></select></label>
        <label><input type="checkbox" id="autoSpeak" checked> Lecture vocale auto</label>
      </div>
      <div id="scholar-area" style="display:none">
        <div class="muted">Scholar a citer (optionnel) :</div>
        <div class="scholar-list" id="scholar-list"></div>
      </div>
      <div class="row-input">
        <textarea id="input" placeholder="Posez votre question... (dictee ou texte)" rows="1"></textarea>
        <div class="btn-group">
          <button class="btn-mic" id="mic" onclick="toggleDictation()" title="Dictee orale">ðŸŽ¤</button>
          <button class="primary" id="send" onclick="send()">Envoyer</button>
        </div>
      </div>
      <button class="confirm-btn" id="confirm-dict" onclick="confirmDictation()">Terminer la question</button>
    </div>
  </div>
</div>
<script src="/app.js"></script>
<script>
if (!requireLogin()) throw new Error('redirect');
updateNav();

const messages = document.getElementById('messages');
const input = document.getElementById('input');
const micBtn = document.getElementById('mic');
const dictStatus = document.getElementById('dict-status');
const confirmBtn = document.getElementById('confirm-dict');
const scholarArea = document.getElementById('scholar-area');
const scholarList = document.getElementById('scholar-list');
let busy = false;
let currentRecognition = null;
let selectedScholar = null;

const scholars = ['Ibn Taymiyya','Ibn Kathir','Al-Ghazali','An-Nawawi','Ibn Baz','Al-Albani','Ibn Qayyim','Ash-Shafi\'i','Malik','Ahmad ibn Hanbal'];
scholars.forEach(s => {
  const c = document.createElement('div');
  c.className = 'scholar-chip';
  c.textContent = s;
  c.onclick = () => {
    document.querySelectorAll('.scholar-chip').forEach(x => x.classList.remove('selected'));
    if (selectedScholar === s) { selectedScholar = null; }
    else { selectedScholar = s; c.classList.add('selected'); }
  };
  scholarList.appendChild(c);
});

document.getElementById('domain').addEventListener('change', e => {
  scholarArea.style.display = e.target.value === 'Religion' ? 'block' : 'none';
});

input.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); }});
input.addEventListener('input', () => { input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,150)+'px'; });

function addMsg(text, who, meta = '') {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = `<div>${escapeHtml(text).replace(/\n/g,'<br>')}</div>${meta?`<div class="meta">${meta}</div>`:''}`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function addBotMsg(text, scholar) {
  const div = addMsg(text, 'bot');
  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  actions.innerHTML = `
    <button onclick="speak(this.parentElement.parentElement.querySelector('div').textContent, document.getElementById('lang').value + '-FR')">ðŸ”Š Lire</button>
    <button onclick="shareText(this.parentElement.parentElement.querySelector('div').textContent)">ðŸ”— Partager</button>
    <button onclick="translateMsg(this.parentElement.parentElement.querySelector('div'))">ðŸŒ Traduire</button>
  `;
  div.appendChild(actions);
  if (scholar) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = 'Source : ' + scholar;
    div.appendChild(m);
  }
  return div;
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true;
  document.getElementById('send').disabled = true;
  input.value = ''; input.style.height = 'auto';

  addMsg(text, 'user');
  const lang = document.getElementById('lang').value;
  const domain = document.getElementById('domain').value;
  const loading = addMsg('Reflexion...', 'bot');

  try {
    const r = await apiCall('/ask', {
      method: 'POST',
      body: JSON.stringify({ question: text, language: lang, domain, scholar: selectedScholar })
    });
    loading.remove();
    addBotMsg(r.answer, r.scholar);
    if (document.getElementById('autoSpeak').checked) {
      speak(r.answer, lang === 'ar' ? 'ar-SA' : (lang === 'en' ? 'en-US' : 'fr-FR'));
    }
  } catch (e) {
    loading.textContent = 'Erreur : ' + e.message;
  } finally {
    busy = false;
    document.getElementById('send').disabled = false;
    input.focus();
  }
}

function toggleDictation() {
  if (currentRecognition) {
    stopDictation();
    currentRecognition = null;
    micBtn.classList.remove('active');
    dictStatus.classList.remove('active');
    confirmBtn.classList.remove('active');
  } else {
    currentRecognition = startDictation(
      (text) => { input.value = text; },
      (finalText) => {
        input.value = finalText;
        confirmBtn.classList.add('active');
      }
    );
    if (currentRecognition) {
      micBtn.classList.add('active');
      dictStatus.classList.add('active');
    }
  }
}

function confirmDictation() {
  stopDictation();
  currentRecognition = null;
  micBtn.classList.remove('active');
  dictStatus.classList.remove('active');
  confirmBtn.classList.remove('active');
  send();
}

function shareText(text) {
  if (navigator.share) {
    navigator.share({ title: 'Scholars Connect', text }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text);
    alert('Texte copie dans le presse-papiers.');
  }
}

async function translateMsg(el) {
  const text = el.textContent;
  const target = prompt('Traduire en quelle langue ? (fr, en, ar, es, de, it, pt, ru, zh, tr)', 'en');
  if (!target) return;
  try {
    const r = await apiCall('/translate', { method: 'POST', body: JSON.stringify({ text, targetLanguage: target }) });
    const div = document.createElement('div');
    div.style.marginTop = '8px';
    div.style.paddingTop = '8px';
    div.style.borderTop = '1px dashed #e5e7eb';
    div.style.fontStyle = 'italic';
    div.textContent = '[' + target + '] ' + r.translation;
    el.parentElement.appendChild(div);
  } catch (e) { alert('Erreur traduction : ' + e.message); }
}

// Charger l'historique au demarrage
(async () => {
  try {
    const r = await apiCall('/history');
    if (r.items && r.items.length) {
      const last5 = r.items.slice(0, 5).reverse();
      for (const it of last5) {
        addMsg(it.question, 'user');
        addBotMsg(it.answer, it.scholar);
      }
    }
  } catch {}
})();
</script></body></html>
